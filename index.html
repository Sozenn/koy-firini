<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Köy Fırını: çiftlikten malzeme topla, değirmende un öğüt, fırında pişir, sat; kafeni ve şubelerini büyüt. Usta işiyle altın ürünler pişir.">
<meta name="theme-color" content="#1c1009">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Köy Fırını">
<title>Köy Fırını</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="assets/fonts/baloo2-800.woff2?v=21" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/items.png?v=21" as="image">
<style>
/* ================= Köy Fırını v21 arayüzü =================
   Koyu ceviz ahşabı oyun üstü göstergeler, açık parşömen paneller, pirinç çerçeveler.
   Yazı tipi: Baloo 2 (SIL OFL, assets/fonts). */
@font-face{font-family:"Baloo 2";font-weight:600;font-display:swap;src:url(assets/fonts/baloo2-600.woff2?v=21) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;font-display:swap;src:url(assets/fonts/baloo2-800.woff2?v=21) format("woff2")}
:root{
  --void:#1c1009; --ink:#fff4df; --muted:#dcc5a2; --gold:#ffcb4c; --gold-deep:#c4861a;
  --ok:#8ccf4a; --bad:#e8643a; --panel:#2a1a10; --line:rgba(255,214,150,.2); --stone:#3d2919;
  --wood:#6b4426; --wood-dark:#3a2212; --brass:#c79a52; --paper:#f6e6c4; --paper-2:#fbf1da; --terra:#a3401c;
  --f-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --f-body:"Baloo 2","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;overflow:hidden;background:var(--void)}
*,*::before,*::after{box-sizing:inherit}
html,body,#app{margin:0;padding:0;height:100%;height:100dvh}
body{overflow:hidden;background:var(--void);color:var(--ink);font:600 15px/1.4 var(--f-body);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ---------- Ortak ahşap düğme ve göstergeler ---------- */
.chipbox,#cash,#daypill,#goal,#recipe{background:linear-gradient(180deg,rgba(66,42,24,.95),rgba(40,24,13,.95));border:2px solid #8a6236;
  box-shadow:inset 0 1px 0 rgba(255,236,200,.18),0 3px 0 rgba(20,10,4,.6),0 6px 14px rgba(0,0,0,.25);border-radius:14px}
.woodbtn,#mobileTools button,#dropBtn{background:linear-gradient(180deg,#86592f,#5e3b1e);border:2px solid #2a170b;color:var(--ink);
  box-shadow:inset 0 2px 0 rgba(255,230,190,.28),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 #2a170b,0 7px 14px rgba(0,0,0,.3);
  font:800 14px/1 var(--f-display);border-radius:14px;transition:transform .08s,box-shadow .08s}
.woodbtn:active,#mobileTools button:active,#dropBtn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,230,190,.2),0 1px 0 #2a170b}
.ic{width:18px;height:18px;display:inline-block;vertical-align:-4px;background:url(assets/items.png?v=21) no-repeat;background-size:600% 400%;flex:none}
.ic.gold{filter:drop-shadow(0 0 3px #ffd34a) saturate(1.3) brightness(1.08)}
.coin{display:inline-block;width:26px;height:26px;flex:none;background:url(assets/items.png?v=21) no-repeat;background-size:600% 400%;background-position:60% 100%}

/* ---------- Üst bilgi şeridi ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;display:grid;grid-template-columns:1fr;gap:6px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 16px max(12px,env(safe-area-inset-left));
  background:linear-gradient(rgba(20,10,4,.55),rgba(20,10,4,0))}
#hud .hl{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
#cash{display:flex;align-items:center;gap:7px;height:42px;padding:4px 14px 4px 7px;min-width:100px;font:800 22px/1 var(--f-display);color:var(--gold);
  font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#cash.pulse{animation:pulse .25s}
#daypill{display:flex;align-items:center;gap:7px;height:42px;padding:4px 10px;min-width:0;max-width:calc(100% - 112px);font:800 12px/1.1 var(--f-display);color:var(--ink);white-space:nowrap}
#dayTxt{min-width:0;overflow:hidden;text-overflow:ellipsis}
#daypill .bar{width:34px;height:7px;border-radius:4px;background:#1a0e06;overflow:hidden;flex:none;box-shadow:inset 0 1px 2px #000}
#daypill .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd76a,#f0a020)}
.stars{color:#5c4632;letter-spacing:-1px;font-style:normal;flex:none;font-size:12px}
.stars i{font-style:normal}.stars i.on{color:var(--gold);text-shadow:0 0 6px rgba(255,200,70,.5)}.stars i.half{color:#b9861c}
#goal{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;min-height:36px;max-height:52px;padding:8px 12px;font:700 12.5px/1.35 var(--f-body);color:var(--ink);overflow:hidden}
#goal b{color:var(--gold)}
#alerts{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
#alerts:empty{display:none}
.alert{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;font:800 12px/1.1 var(--f-display);color:#fff;
  background:linear-gradient(180deg,#c9502d,#8e2c12);border:2px solid #3a1406;box-shadow:0 3px 0 rgba(30,8,2,.6);animation:alertIn .35s ease-out}
.alert .ic{width:16px;height:16px}
.alert small{font:700 10.5px var(--f-body);opacity:.85}
@keyframes alertIn{from{transform:translateY(-8px) scale(.9);opacity:0}}
@keyframes pulse{50%{transform:scale(1.08)}}

/* ---------- Altta: bırak, usta işi, araç çubuğu ---------- */
#dropBtn{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:10;pointer-events:auto;height:48px;padding:0 16px;
  background:linear-gradient(180deg,#d0573a,#9a3420)}
#ustaBtn{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:11;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;align-content:center;gap:0;padding:0;color:#3a1c00;font:800 13px/1 var(--f-display);
  background:radial-gradient(circle at 38% 30%,#fff3b8,#ffd24a 45%,#e48e12);border:3px solid #5a3000;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(120,60,0,.35),0 5px 0 #5a3000,0 0 0 6px rgba(255,210,80,.18),0 10px 24px rgba(0,0,0,.4);
  animation:ustaGlow 1.6s ease-in-out infinite;touch-action:none}
#ustaBtn .ic{width:34px;height:34px;margin-bottom:2px}
#ustaBtn.live{animation:none;background:radial-gradient(circle at 38% 30%,#ffffff,#ffe27a 45%,#f0a020)}
#ustaBtn:active{transform:translateX(-50%) translateY(3px)}
@keyframes ustaGlow{50%{box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(120,60,0,.35),0 5px 0 #5a3000,0 0 0 12px rgba(255,210,80,.28),0 10px 24px rgba(0,0,0,.4)}}
#mobileTools{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:10;display:grid;grid-template-columns:repeat(2,50px);gap:9px}
#mobileTools button{width:50px;height:50px;font-size:13px;padding:0}
#mobileTools #pauseBtn{width:109px;grid-column:1/-1;display:flex;gap:8px;justify-content:center;align-items:center;font-size:15px}
#mobileTools #pauseBtn svg{width:14px;height:14px;fill:var(--ink)}
#mobileTools .zoom{font-size:22px}
#bookBtn.hasReward{color:var(--gold);box-shadow:inset 0 2px 0 rgba(255,230,190,.28),0 4px 0 #2a170b,0 0 0 3px rgba(255,203,76,.55)}

/* ---------- Bildirimler ---------- */
#toast{position:absolute;left:50%;bottom:24%;transform:translate(-50%,20px);opacity:0;transition:.25s;z-index:12;max-width:86%;pointer-events:none;
  background:linear-gradient(180deg,#fff8e6,#f3dfb6);color:#3b2414;font:800 13.5px/1.3 var(--f-display);padding:9px 16px;border-radius:999px;text-align:center;
  border:2px solid #b88a4a;box-shadow:0 4px 0 rgba(60,30,10,.35),0 10px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#daycard{position:absolute;left:50%;top:28%;transform:translateX(-50%);z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:linear-gradient(180deg,#fff8e6,#f0d9aa);color:#3b2414;border:3px solid #8a5a2a;border-radius:18px;padding:14px 22px;text-align:center;max-width:86%;
  box-shadow:0 6px 0 rgba(60,30,10,.4),0 16px 36px rgba(0,0,0,.4);animation:alertIn .4s ease-out}
#daycard b{font:800 22px var(--f-display);color:var(--terra)}
#daycard span{font-size:14px}
#daycard .stars{font-size:22px}
#daycard .stars i.on{color:#e0a010}

/* Tarif şeridi (istasyonun yanındayken) */
#recipe{position:absolute;left:50%;top:112px;transform:translateX(-50%);z-index:6;max-width:calc(100% - 24px);pointer-events:none;white-space:normal;flex-wrap:wrap;
  padding:6px 12px;font:800 13px/1.2 var(--f-display);display:flex;align-items:center;gap:6px;overflow:hidden;border-radius:12px}
#recipe .rc-c{display:inline-flex;align-items:center;gap:4px}
#recipe .rc-c.ok{color:var(--ok)} #recipe .rc-c.no{color:#ff9a76}
#recipe .rc-op{color:var(--muted)} #recipe em{font-style:normal;color:var(--gold);font-size:12px}
#recipe .rc-w{color:#ff9a76;font-size:12px}
#recipe .rc-u{color:var(--gold);font-size:12px}

/* ---------- Parşömen paneller: usta masası ve pencereler ---------- */
.paper,#modal .box,#desk{--ink:#3b2414;--muted:#86684a;--line:#dcc396;--stone:#ecd6ab;--gold:#9c5f00;--ok:#4c9a2a;--bad:#c2452a;
  color:var(--ink);background:linear-gradient(180deg,var(--paper-2),var(--paper));color-scheme:light}
#desk{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:64%;z-index:25;display:flex;flex-direction:column;
  border:3px solid #7a4e28;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
#desk .dhead{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;margin:-1px -1px 0;border-radius:17px 17px 0 0;
  background:linear-gradient(180deg,#86592f,#5e3b1e);color:var(--paper-2);box-shadow:inset 0 2px 0 rgba(255,230,190,.25)}
#desk .dhead b{font:800 19px/1.2 var(--f-display);flex:1;color:#fff1cf;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#desk .dhead span{display:flex;align-items:center;gap:6px;font:800 16px var(--f-display);color:#ffd76a;font-variant-numeric:tabular-nums}
#desk .dhead .coin{width:20px;height:20px}
#deskClose{width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.25);font:800 22px/1 var(--f-display);color:#fff1cf}
#deskTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px 10px}
#deskTabs button{padding:8px 2px;border-radius:10px;font:800 12.5px var(--f-display);color:var(--muted);position:relative;background:rgba(122,78,40,.08);border:1px solid var(--line)}
#deskTabs button.on{background:linear-gradient(180deg,#86592f,#5e3b1e);color:#fff1cf;border-color:#3a2212;box-shadow:inset 0 2px 0 rgba(255,230,190,.25)}
#deskTabs button.dot::after{content:"";position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--paper-2)}
#deskList{overflow-y:auto;padding:0 12px 14px;overscroll-behavior:contain;touch-action:pan-y}
.row{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px dashed var(--line)}
.ri{flex:1;min-width:0}
.rn{font:800 15px/1.25 var(--f-display);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font:800 11px var(--f-body);color:var(--muted);background:var(--stone);padding:1px 8px;border-radius:999px}
.ri p{margin:3px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.row.lock{opacity:.78}
.row.lock .rn{color:var(--muted)}
.buy{flex:none;min-width:88px;min-height:48px;padding:6px 10px;border-radius:12px;color:#fff;font:800 15px/1.1 var(--f-display);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#7fc24a,#4f8f26);border:2px solid #2f5a14;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 #2f5a14;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.buy small{font:800 10px var(--f-body);opacity:.9}
.buy.no{background:linear-gradient(180deg,#d9c39a,#bfa477);border-color:#9c845c;box-shadow:0 3px 0 #9c845c;color:#6e5638;text-shadow:none}
.buy.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.done{flex:none;min-width:88px;text-align:center;font:800 12px var(--f-display);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:2px;margin-top:5px;padding:6px 8px;border-radius:8px;background:rgba(122,78,40,.1);color:var(--muted)}
.steps b{color:var(--ink);font-size:12px}
.steps .next{color:var(--terra);font-weight:800}
.pri{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pri button{padding:7px 10px;border-radius:9px;background:var(--stone);font:800 12px var(--f-display);color:var(--ink);border:1px solid var(--line)}
.pri button.on{background:linear-gradient(180deg,#86592f,#5e3b1e);color:#fff1cf;border-color:#3a2212}

#modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:rgba(14,7,3,.7)}
#modal .box{width:min(420px,100%);max-height:100%;overflow-y:auto;border:3px solid #7a4e28;border-radius:20px;padding:20px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 8px 0 rgba(40,20,8,.5),0 20px 50px rgba(0,0,0,.5);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#modal h2{margin:0 0 8px;font:800 25px/1.12 var(--f-display);color:var(--terra);text-wrap:balance}
#modal p,#modal li{font-size:14.5px;line-height:1.5}
#modal ol{padding-left:22px;margin:8px 0}
#modal li{margin:4px 0}
#modal .btns{display:grid;gap:8px;margin-top:14px}
#modal .btns button{padding:12px;border-radius:13px;background:var(--stone);border:2px solid #c9ab78;font:800 15.5px var(--f-display);color:var(--ink);box-shadow:0 3px 0 #c9ab78}
#modal .btns button:active{transform:translateY(2px);box-shadow:0 1px 0 #c9ab78}
#modal .btns button.pri{background:linear-gradient(180deg,#ffd76a,#eba32a);color:#3a1c00;border-color:#9a6000;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #9a6000}
#modal .btns button.danger{color:var(--bad)}
#modal textarea{width:100%;min-height:92px;margin-top:6px;padding:10px;border-radius:10px;border:2px solid var(--line);background:#fffaf0;color:inherit;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;resize:vertical}
#modal .note{font-size:13px;color:var(--muted)}
#modal .logo{display:block;width:min(320px,90%);margin:-8px auto 4px;filter:drop-shadow(0 6px 10px rgba(80,40,10,.35))}
#modal .lead{text-align:center;font-size:15px;margin:0 0 6px}
.whatsnew{list-style:none;padding:0!important}
.whatsnew li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.whatsnew li .ic{width:26px;height:26px}
.whatsnew b{color:var(--terra)}
.quest{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.quest em{font-style:normal;color:var(--gold);font-weight:800}
.quest.done{opacity:.55}.quest.done span{color:var(--ok)}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:800 16px/1.2 var(--f-display)}
.rc-h em{font-style:normal;color:var(--gold);font-size:13px;white-space:nowrap}
.book-item{padding:8px 0;border-top:1px dashed var(--line)}
.eq{font-size:13.5px;line-height:1.8}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;margin-right:2px}
.flowGroup{margin:10px 0;border:2px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.35)}
.flowGroup summary{cursor:pointer;font-weight:800}
.flowRoute{display:block;width:100%;text-align:left;padding:10px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fffaf0;color:var(--ink)}
.flowRoute small{display:block;margin-top:4px;color:var(--muted);line-height:1.4}

/* Köy panosu */
.vHeader{padding:2px 0 10px}.vEyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#9c7a4a}
.vHeader h2{margin:4px 0!important}.vHeader p{margin:6px 0;color:var(--gold);font-weight:800}.vHeader p span{color:var(--muted);font-size:12px}
.vTabs{position:sticky;top:-20px;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0;background:var(--paper)}
.vTabs button{padding:9px 2px;border:1px solid var(--line);border-radius:9px;font-size:12px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.4)}
.vTabs .selected{color:#fff1cf;background:linear-gradient(180deg,#86592f,#5e3b1e);border-color:#3a2212}
.vIntro{font-size:12.5px!important;color:var(--muted);line-height:1.6}
.vCard{background:#fffaf0;border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 3px 0 var(--line)}
.vCard.active{border-color:#e0a530;box-shadow:0 3px 0 #e0a530}
.vCard h3{margin:6px 0;font:800 18px var(--f-display)}
.vCard p{font-size:12.5px;line-height:1.5;margin:8px 0}
.vCard small{display:block;font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}
.vReward{font-size:13px;font-weight:800;color:var(--gold);margin:10px 0}
.vAction{width:100%;padding:11px;border-radius:11px;background:linear-gradient(180deg,#7fc24a,#4f8f26);color:#fff;font-size:13px;font-weight:800;margin-top:8px;border:2px solid #2f5a14;box-shadow:0 3px 0 #2f5a14}
.vAction:disabled{background:#e3d2b0;color:#9a8466;border-color:#cbb48a;box-shadow:none;cursor:default}
.vProduct{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;margin-top:10px}
.vBar{height:8px;background:#ead6ae;border-radius:5px;overflow:hidden;margin-top:6px}.vBar i{height:100%;display:block;background:linear-gradient(90deg,#8fd05a,#4f8f26)}
.vBadges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vBadge{padding:10px 3px;background:#f3e2bd;border:2px solid #c9a86a;border-radius:11px;font-size:10.5px;color:var(--ink)}
.vBadge b{font-size:24px;color:#c48a12;display:block}.vBadge span{display:block}.vBadge small{font-size:9.5px}
.vBadge:disabled{opacity:.45}.vBadge.claimed{border-color:#6aa040;opacity:1;background:#e3f0cf}
.vPerson{width:44px;height:44px;border-radius:50%;background:var(--person);font-size:24px;text-align:center;line-height:44px;float:right;color:#fff;border:3px solid #fff;box-shadow:0 2px 0 var(--line)}
.vPreview{height:100px;background:var(--dark);border-radius:10px;text-align:center;color:var(--accent);overflow:hidden}
.vAwning{height:16px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,var(--dark) 18px 36px)}
.vPreview b{display:block;font-size:15px;letter-spacing:1.2px;padding:12px 0 8px}
.vWindow{display:flex;justify-content:center;align-items:center;gap:11px;height:40px;margin:auto;width:150px;background:#1a211c;border-radius:8px 8px 0 0;padding:9px}

  for (const [v, s] of [[1e9,'Mr'],[1e6,'Mn'],[1e3,'B']])

}

function normalize(d) {
  if (!d || typeof d.money !== 'number') return null;
  const f = fresh();
  const st = f.st; if (d.st) for (const id in st) { Object.assign(st[id].bins, d.st[id] && d.st[id].bins); st[id].out = (d.st[id] && d.st[id].out) || 0; }
  const out = Object.assign(f, d, { lv:Object.assign(f.lv, d.lv), counter:Object.assign(f.counter, d.counter), st,
    depot:Object.assign(f.depot, d.depot), paid:Object.assign({}, d.paid), unlocked:Object.assign({}, d.unlocked), hinted:Object.assign({}, d.hinted), learned:Object.assign({}, d.learned) });
  for (const o of [out.lv, out.counter, out.paid, out.depot, ...Object.values(out.st).map(s => s.bins)]) for (const k in o) if (!Number.isFinite(o[k])) o[k] = 0;
  if (!d.depot) { out.px = 340; out.py = 330; }   // önceki sürüm kaydı: yeni yerleşimde güvenli bir yerden başla
  for (const s of Object.values(out.st)) if (!Number.isFinite(s.out)) s.out = 0;

function collide(e, r) {
  for (const b of boxes()) {
    const cx = Math.max(b.x, Math.min(e.x, b.x + b.w)), cy = Math.max(b.y, Math.min(e.y, b.y + b.h));
    const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < r * r) {
      if (d2 > 1e-6) { const d = Math.sqrt(d2); e.x += dx / d * (r - d); e.y += dy / d * (r - d); }
      else {
        const l = e.x - b.x, rr = b.x + b.w - e.x, t = e.y - b.y, bb = b.y + b.h - e.y, m = Math.min(l, rr, t, bb);
        if (m === l) e.x = b.x - r; else if (m === rr) e.x = b.x + b.w + r; else if (m === t) e.y = b.y - r; else e.y = b.y + b.h + r;
      }
    }
  }
  e.x = Math.max(44, Math.min(W - 30, e.x)); e.y = Math.max(122, Math.min(H - 52, e.y));
}

const regionOf = (x, y) => x >= SHOP_EDGE ? 'farm' : y < 445 ? 'top' : y < 880 ? 'low' : y < CARSI_Y + 50 ? 'street' : 'carsi';
const PORTALS = {
  'top>farm':[[LANE_X, DOOR.y], [DOOR.outX, DOOR.y]], 'farm>top':[[DOOR.outX, DOOR.y], [LANE_X, DOOR.y]],
  'top>low':[[CORRIDOR.x, CORRIDOR.y], [626, 540]],   'low>top':[[626, 540], [CORRIDOR.x, CORRIDOR.y]],
  'low>street':[[300, 862], [300, STREET_Y]],          'street>low':[[300, STREET_Y], [300, 862]],
  'street>carsi':[[700, STREET_Y], [700, CARSI_Y + 120]], 'carsi>street':[[700, CARSI_Y + 120], [700, STREET_Y]],
};
const NEXT_REGION = {
  top:{ farm:'farm', low:'low', street:'low', carsi:'low' }, low:{ top:'top', farm:'top', street:'street', carsi:'street' },
  street:{ low:'low', top:'low', farm:'low', carsi:'carsi' }, carsi:{ street:'street', low:'street', top:'street', farm:'street' },
  farm:{ top:'top', low:'top', street:'top', carsi:'top' },
};
const atPt = (n, p) => Math.abs(n.x - p[0]) < .5 && Math.abs(n.y - p[1]) < .5;
function navStep(n, tx, ty) {
  if (n.via) { if (atPt(n, n.via)) n.via = null; else return n.via; }   // kapıdan geçerken giriş noktasına varana dek
  const a = regionOf(n.x, n.y), b = regionOf(tx, ty);
  if (a === b) return [tx, ty];
  const [ex, en] = PORTALS[a + '>' + NEXT_REGION[a][b]];
  if (atPt(n, ex)) { n.via = en; return en; }
  return ex;
}
function walk(n, tx, ty, spd, dt) {
  const [wx, wy] = navStep(n, tx, ty);
  const dx = wx - n.x, dy = wy - n.y, d = Math.hypot(dx, dy), st = spd * dt;
  if (d > st) { n.x += dx / d * st; n.y += dy / d * st; n.fx = dx / d; n.fy = dy / d; }
  else { n.x = wx; n.y = wy; }
  n.moving = !(n.x === tx && n.y === ty);
  if (n.moving) n.phase += dt * 13;
}

const GATHER_SFX = { bugday:'chop', susam:'chop', su:'splash', sut:'milk', yumurta:'egg', cilek:'egg', bal:'egg', findik:'egg', zeytin:'egg', seker:'drop' };
function gather(e, carry, capN, dt, timeFn, onlyMat) {
  let best = null, bd = 34 * 34;
  for (const nd of NODES) {
    if (!nodeOpen(nd) || nd.amt <= 0 || (onlyMat && nd.m !== onlyMat)) continue;
    const d = dist2(e, nd.x, nd.y); if (d < bd) { bd = d; best = nd; }
  }
  e.gNode = null;
  if (!best || carry.length >= capN) { e.gT = 0; return false; }
  e.gNode = best; e.gT = (e.gT || 0) + dt;
  const need = timeFn(best.m); e.gProg = e.gT / need;
  e.bitT = (e.bitT || 0) + dt;
  if (e.bitT > .22) { e.bitT = 0; chips(best.x, best.y, MATS[best.m].bit, 2); if (e === P) sfx(GATHER_SFX[best.m] || 'chop', .8); }
  if (e.gT >= need) {
    e.gT = 0; best.amt--; carry.push(best.m); chips(best.x, best.y, MATS[best.m].bit, 5);
    if (best.m === 'sut' && Math.random() < .25) { say(best, pick(BANTER.cow)); if (e === P) sfx('moo', .7); }   // sağılan inek söylenir
    if (best.m === 'yumurta' && e === P && Math.random() < .2) sfx('cluck', .6);
    fly('item', best.m, best.x, best.y - 10, cp(e).x, cp(e).y, .22);
    if (e === P) sfx('pick');
  }
  return true;
}
// İstasyonun önündeki dairede: sırttaki uygun malzeme kutusuna geçer (accept ile süzülür)
function depositTo(e, carry, s, dt, rate = .07, accept = () => true) {
  let i = carry.length - 1; while (i >= 0 && !(binRoom(s, carry[i]) && accept(carry[i]))) i--;
  if (i < 0) { e.depT = 0; return false; }
  e.depT = (e.depT || 0) + dt;
  if (e.depT >= rate) {
    e.depT = 0; const t = carry.splice(i, 1)[0]; G.st[s.id].bins[t]++;
    const k = Object.keys(s.recipe).indexOf(t);
    fly('item', t, cp(e).x, cp(e).y, binPos(s, k).x, binPos(s, k).y - 6, .22);
    if (e === P) sfx('drop');

  return true;
}

const standSpot = k => ({ x:STAND.x + 14 + (k % 6) * 18, y:STAND.y + 6 - Math.floor(k / 6) % 3 * 8 });
const CRATE = { w:62, h:38, gap:4 };   // ürün bölmesi
const crateX = t => { const sh = shopOf(t); return COUNTERS[sh].x + 64 + SHOP_PRODS[sh].indexOf(t) * (CRATE.w + CRATE.gap); };
function counterSpot(t, k) { const C = COUNTERS[shopOf(t)]; k = k % 8; return { x:crateX(t) + 13 + (k % 4) * 12, y:C.y - C.h + 21 + Math.floor(k / 4) * 13 }; }
function binPos(s, k) {
  const n = Object.keys(s.recipe).length, w = 30;
  return { x:s.x - (n * w) / 2 + w / 2 + k * w, y:s.y + 52 };

// Bir istasyona yolda olan eşya: çırakların el arabası + bantların üstündekiler
function incoming(stId, item) {
  let k = 0;
  for (const n of carriers) if (n.task && n.task.dst === stId && n.task.item === item) k += n.state === 'fetch' ? n.task.amount : n.carry.filter(t => t === item).length;
  for (const r of riders) if (r.dst === stId && r.item === item) k++;
  return k;
}
function beltIncomingCounter(p) { let k = 0; for (const r of riders) if (r.dst === 'counter' && r.item === p) k++; return k; }
// Bir hammaddenin istasyon kutularında eksik kalan toplam miktarı (yoldakiler düşülür)
function needFor(m) {
  let n = 0;
  for (const s of STATIONS) if (active(s) && s.recipe[m] !== undefined) n += Math.max(0, Math.min(binCap(), s.recipe[m] * 3) - G.st[s.id].bins[m] - incoming(s.id, m));
  return n;
}
// Malzemenin önceliği: talebi olan ürünün istasyonu ve kutusu boşalmış istasyon önce
// Bir ara ürünün (un/hamur) o binada kıt olup olmadığı: onu kullanan istasyonların kutusu + üreticinin tepsisi azsa
function interShort(item, shop) {
  const pr = producerOf(item, shop); if (!pr || !active(pr)) return false;
  return STATIONS.some(o => o.shop === shop && active(o) && o.recipe[item] && G.st[o.id].bins[item] + G.st[pr.id].out < o.recipe[item] * 2);
}
function matPriority(m) {
  let w = 0;
  for (const s of STATIONS) {
    if (!active(s) || s.recipe[m] === undefined) continue;
    let x = 1;
    if (s.kind === 'oven' && DEM[s.out] > 0) x *= 4;
    if (INTER[s.out] && interShort(s.out, s.shop)) x *= 3;
    if (G.st[s.id].bins[m] < s.recipe[m]) x *= 2;
    w = Math.max(w, x);
  }
  return w;
}
// Bir ara ürünün aynı binadaki kullanıcılarında kalan boş yer (yoldakiler ve oyuncunun elindekiler düşülür)
function interRoomForPlayer(item, shop) {
  let room = 0;
  for (const s of STATIONS) if (s.shop === shop && active(s) && s.recipe[item]) room += binCap() - G.st[s.id].bins[item] - incoming(s.id, item);
  return room - G.carry.filter(t => t === item).length;
}
// Ambar: girişte ne için geldiğin belli olur.
//  Elinde hammadde varsa → bırakma ziyareti: hepsi ambara konur (kutunun sınırına kadar), bu ziyarette ambardan alınmaz.
//  Elin hammaddesizse → alma ziyareti: üretimin ihtiyacı olan malzemeler (önce talebi olan) ambardan eline alınır.
function playerDepot(dt) {
  if (!inDepot(P)) { P.dpT = 0; P.depMode = null; return; }
  if (!P.depMode) P.depMode = G.carry.some(t => MATS[t]) ? 'drop' : 'take';
  P.dpT = (P.dpT || 0) + dt; if (P.dpT < .08) return; P.dpT = 0;
  if (P.depMode === 'drop') {
    for (let i = G.carry.length - 1; i >= 0; i--) {
      const m = G.carry[i];
      if (MATS[m] && depotRoom(m)) { G.carry.splice(i, 1); G.depot[m]++; fly('item', m, cp(P).x, cp(P).y, depotBinPos(m).x, depotBinY(m) - 6, .22); sfx('drop'); return; }
    }
    if (G.carry.some(t => MATS[t])) P.depotFull = true;   // kalan varsa kutusu dolu
    return;
  }
  if (G.carry.length >= cap()) return;
  let best = null, bs = 0;
  for (const m of MAT_ORDER) {
    if (G.depot[m] <= 0) continue;
    const lack = needFor(m) - G.carry.filter(x => x === m).length;
    if (lack > 0 && matPriority(m) * lack > bs) { bs = matPriority(m) * lack; best = m; }
  }
  if (best) { G.depot[best]--; G.carry.push(best); fly('item', best, depotBinPos(best).x, depotBinY(best) - 6, cp(P).x, cp(P).y, .22); sfx('pick'); }
}

  if (keep.length === G.carry.length) { toast('Usta işi ürünleri usta rafına ya da sipariş sepetine götür'); sfx('no'); return; }
  for (let i = G.carry.length - 1; i >= 0; i--) {

    if (isGold(t)) continue;
    const home = INTER[t] ? producerOf(t, t === 'un' && P.y < CARSI_Y ? 0 : 1) : OVENS.find(s => s.out === t);
    if (home) { G.st[home.id].out++; const z = zoneOf(home); fly('item', t, cp(P).x, y0, z.x, z.y - 4, .35 + i * .03); }
    else if (MATS[t] && depotRoom(t)) { G.depot[t]++; fly('item', t, cp(P).x, y0, depotBinPos(t).x, depotBinY(t) - 6, .45 + i * .03); }

}

// Yürüyen müşteri: önce yol noktaları (kapı), sonra hedef. Varınca true döner.
function stepWalker(c, spd, dt) {

// Her dükkanın satış durumu: kuyruğun başındaki müşteri, satış sayacı, kasa çekmecesi animasyonu
const SV = [{ t:0, int:.2, front:null, regAnim:0 }, { t:0, int:.2, front:null, regAnim:0 }];

function arrivalInterval(sh, eventMul = 1) {
  const ps = shopProducts(sh), stock = ps.reduce((a,p) => a + G.counter[p] + G.st[OVENS.find(s => s.out === p).id].out, 0);

  const capacity = Math.max(1, OVENS.filter(s => s.shop === sh && active(s)).length);
  return Math.max(4, (8 - capacity * .45) * (stock < 3 ? 1.8 : 1) * (1 + waiting * .3) / Math.min(1.25,eventMul));

function updateCustomers(dt) {

  const interval = arrivalInterval(0, evMul);

  spawnT += dt;

    const cafeChance = ev && ev.cafe ? ev.cafe : phaseOf() === 'sabah' ? .25 : .45;
    if (freeTable >= 0 && Math.random() < cafeChance) { spawnT = 0; spawnGuest(freeTable); }

  }
  if (G.unlocked.carsi) {

    spawnT2 += dt;
    if (phaseOf() !== 'gece' && spawnT2 >= arrivalInterval(1, evMul) && q1.length < QUEUE[1].max) { spawnT2 = 0; spawnCustomer(1); }

    q.forEach((c, i) => { c.tx = Q.x; c.ty = Q.y0 + i * 44; });

// Kuyruğun başındaki müşteriye satış: kasiyer (ya da müdür) tezgahtaysa veya sen yeşil alandaysan
function serveShop(sh, dt) {

// Bir gün 3 dakika: sabah ekmek, öğle karışık, akşam pasta daha çok aranır; gece müşteri gelmez, çalışanlar stok hazırlar.
const DAY_LEN = 180;
const PHASES = {
  sabah:{ name:'Sabah', w:{ ekmek:6, simit:5, pogaca:4, kurabiye:1, pasta:1, borek:6, aycoregi:3, pide:1, baklava:1 }, hint:'Ekmek, simit ve börek çok aranır' },

  aksam:{ name:'Akşam', w:{ ekmek:2, simit:1, pogaca:2, kurabiye:4, pasta:5, borek:1, aycoregi:3, pide:3, baklava:5 }, hint:'Pasta, kurabiye ve baklava çok aranır' },
  gece: { name:'Gece',  w:null,                           hint:'Dükkan kapalı, çalışanlar stok hazırlar' },
};
function phaseOf(t = G.dayT) { const f = t / DAY_LEN; return f < .3 ? 'sabah' : f < .6 ? 'ogle' : f < .85 ? 'aksam' : 'gece'; }
// Kazanç: köy fırınınınki ve kafeninki fırının altın yığınına, Çarşı şubesininki şubenin yığınına; 'direct' doğrudan kesene
function earn(amount, units, shop = 0) {
  amount *= usta();
  if (shop === 'direct') G.money += amount; else if (shop === 1) G.cash2 += amount; else G.cash += amount;
  G.sold += units; G.today.earned += amount; G.today.sold += units; G.ern += amount;
}
function addRep(d) { G.rep = Math.max(0, Math.min(5, G.rep + d)); }
function updateDay(dt) {
  const before = phaseOf();
  G.dayT += dt;
  if (G.dayT >= DAY_LEN) { endDay(); return; }
  const now = phaseOf();
  if (now !== before) toast(`${PHASES[now].name}: ${PHASES[now].hint}`);
  // çevrimdışı kazanç için ortalama kazanç hızı (altın/sn), 10 saniyede bir güncellenir
  if ((updateDay.t = (updateDay.t || 0) + dt) >= 10) { const r = (G.ern - (updateDay.e ?? G.ern)) / updateDay.t; updateDay.e = G.ern; updateDay.t = 0; G.rate = G.rate ? G.rate * .9 + r * .1 : r; }
}
let dayCardT;
function endDay() {

// Masa yanında: elde misafirin istediği ürün varsa masaya bırakılır; masa kirliyse silinir.
function serveTables(e, carry, dt, rate = .15) {
  e.cleaning = -1;

        return true;

// Garson: önce bekleyen misafire vitrinden ürün götürür, sonra kirli masaları siler.

const garSpeed = () => 95 * (1 + .12 * G.lv.garsonSpd);
function updateGarson(dt) {

    GAR.task = null;
    for (const g of guests) if (g.state === 'wait' && g.got < g.n && G.counter[g.want] > 0 && !(GAR.task)) GAR.task = { kind:'serve', guest:g };
    if (!GAR.task) { const i = cafeTables().findIndex((t,i) => t.dirty && !t.guest && !carriers.some(n=>n.task?.kind==='clean'&&n.task.table===i)); if (i >= 0) GAR.task = { kind:'clean', table:i }; }
    if (GAR.task) GAR.state = GAR.task.kind === 'serve' ? 'fetch' : 'go';
  }
  let tx = GAR.home.x, ty = GAR.home.y;
  if (GAR.state === 'fetch') {
    const g = GAR.task.guest, p = g.want; tx = crateX(p) + CRATE.w / 2; ty = COUNTER.y + COUNTER.d + 22;   // vitrinin önünden alır
    if (g.state !== 'wait') GAR.state = GAR.carry.length ? 'return' : 'idle';

        if ((GAR.actT += dt) >= .15) { GAR.actT = 0; G.counter[p]--; GAR.carry.push(p); const sp = counterSpot(p, G.counter[p]); fly('item', p, sp.x, sp.y, GAR.x + 8, GAR.y - 34, .2); }
      } else GAR.state = GAR.carry.length ? 'go' : 'idle';

    if (GAR.task.kind === 'serve' && GAR.task.guest.state !== 'wait') GAR.state = GAR.carry.length ? 'return' : 'idle';
    else if (GAR.x === tx && GAR.y === ty && !serveTables(GAR, GAR.carry, dt, .2)) { addXp('gar', 'Garson'); GAR.state = GAR.carry.length ? 'return' : 'idle'; }

  if (M.station) { const s = M.station(); if (!s) return; st = s.id; pos = zoneOf(s); } else pos = M.spot();
  mishaps.push({ k, x:pos.x, y:pos.y, st, t:0, fix:0, max:120, birds:Array.from({ length:k === 'karga' ? 7 : 0 }, () => ({ dx:(Math.random() - .5) * 190, dy:(Math.random() - .5) * 170, ph:Math.random() * 6 })) });
  toast(`Aksilik: ${M.name}! ${M.how}.`); sfx('alert'); setTimeout(() => sfx(M.sfx, .8), 450);
}
function resolveMishap(i) {
  const m = mishaps[i], M = MISHAPS[m.k];
  mishaps.splice(i, 1);

  if (G.stats.fixes % 5 === 0) { G.journal.tokens++; setTimeout(() => toast(`${G.stats.fixes} aksilik çözdün: +1 köy pulu`), 900); }
  else toast(`${M.act} · tamam!`);
}
function updateMishaps(dt) {
  if (hasAutomation() && (mishapT -= dt) <= 0) { mishapT = 70 + Math.random() * 55; if (mishaps.length < 2) spawnMishap(); }
  for (let i = mishaps.length - 1; i >= 0; i--) {
    const m = mishaps[i], M = MISHAPS[m.k];
    m.t += dt;
    const near = dist2(P, m.x, m.y) < M.r * M.r;
    m.fix = near ? m.fix + dt : Math.max(0, m.fix - dt * .5);
    if (near && (m.k === 'is' || m.k === 'tas') && Math.random() < dt * 4) { sfx('clean', .7); chips(m.x, m.y - 30, '#3a3430', 2); }

  for (let i = flyaway.length - 1; i >= 0; i--) { const b = flyaway[i]; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 30 * dt; if (b.t > 2.2) flyaway.splice(i, 1); }
}

/* ================= Çalışan seviyeleri ================= */
// Her biten iş 1 tecrübe; seviye = 1 + √(tecrübe/6), en çok 5. Her seviye %7 hız.
const lvlOf = k => Math.min(5, 1 + Math.floor(Math.sqrt((G.xp[k] || 0) / 6)));
const xpMul = k => 1 + .07 * (lvlOf(k) - 1);
const carSpd = n => carSpeed() * xpMul(n.k);
const gatSpd = n => gatSpeed() * xpMul(n.k);
function addXp(k, name) {
  if (!(k in G.xp)) return;
  const before = lvlOf(k); G.xp[k]++;
  if (lvlOf(k) > before) { toast(`${name} ${lvlOf(k)}. seviyeye çıktı, artık daha hızlı!`); sfx('level'); }
}

// Her 8 saniyede bir talebi en yüksek fırını seçer, başına geçip ateşi harlar: o fırın %30 hızlı pişirir.
const KALFA = { x:40, y:300, st:null, t:0, fx:1, fy:0, phase:0, moving:false };
const kalfaPos = s => ({ x:s.x - 42, y:s.y + 36 });
const kalfaAt = s => !!G.unlocked.kalfa && KALFA.st === s.id && !KALFA.moving;
function updateKalfa(dt) {
  if (!G.unlocked.kalfa) return;
  if ((KALFA.t -= dt) <= 0 || !KALFA.st || !active(ST[KALFA.st])) {
    KALFA.t = 8;
    let best = null, bs = -1;
    for (const s of OVENS0) {
      if (!active(s)) continue;
      const sc = (DEM[s.out] > 0 ? 100 + DEM[s.out] * 10 : 0) + (canBake(s) ? 20 : 0) + (G.st[s.id].out < outMax() ? 5 : 0);
      if (sc > bs) { bs = sc; best = s; }
    }
    if (best) KALFA.st = best.id;
  }
  const s = ST[KALFA.st]; if (!s) return;
  const p = kalfaPos(s), dx = p.x - KALFA.x, dy = p.y - KALFA.y, d = Math.hypot(dx, dy), st = 120 * dt;
  KALFA.moving = d > st;
  if (KALFA.moving) { KALFA.x += dx / d * st; KALFA.y += dy / d * st; KALFA.fx = dx / d; KALFA.fy = dy / d; KALFA.phase += dt * 12; }

}

/* ================= Çırak: talebe göre iş seçer ================= */
// İşler (puanı yüksek olan önce):
//  1) Müşterinin beklediği ürünü fırının tepsisinden vitrine taşı
//  2) Ambardaki hammaddeyi / değirmendeki unu, talebi olan (ya da kutusu boşalan) istasyona götür
//  3) Tepside kalan ürünleri vitrine yerleştir
const DEPOT_SRC = 'AMBAR';
const depotPoint = n => ({x:628+Math.sign(n.off||0)*3,y:DEPOT.y+44+Math.max(0,carriers.indexOf(n))*42});
function claimed(srcId, item, me) { return carriers.some(n => n !== me && n.task && n.task.src === srcId && n.task.item === item && n.state === 'fetch'); }
function claimedAmount(srcId, item, me) { let k = 0; for (const n of carriers) if (n !== me && n.task && n.task.src === srcId && n.task.item === item && n.state === 'fetch') k += n.task.amount; return k; }
function chooseCarrierTask(n) {
  let best = null;
  const consider = t => {
    if ((G.workerPri === 'supply' && ST[t.dst]) || G.workerPri === t.dst) t.score += 450;
    if (t.amount > 0 && (!best || t.score > best.score)) best = t;
  };
  const sh = n.shop || 0, hasSeller = G.unlocked[CSS[sh].unlock];
  const automated=beltOn(sh?'cVitrin':'bVitrin');
  for (const s of OVENS) {
    if(automated)continue;
    if (!active(s) || s.shop !== sh) continue;
    const p = s.out, have = G.st[s.id].out, room = crateCap() - G.counter[p] - beltIncomingCounter(p);
    // fazla ürün: vitrin dolu ve tepside birikmişse tezgaha (köy fırınında)
    if (sh === 0 && G.unlocked.stand && have > 0 && (room <= 0 || (G.counter[p] >= Math.min(2, crateCap()) && standTotal() + standIncoming() < standTarget())) && !claimed(s.id, p, n)) {
      const sr = standCap() - standTotal() - standIncoming();
      if (sr > 0) consider({ score:(standTotal() < standTarget() ? 1150 : 60) + have * 3, src:s.id, item:p, dst:'stand', amount:Math.min(carCap(n), have, sr) });
    }
    // ürünü vitrine taşımak kasiyerin (şubede müdürün) işi; çırak yalnızca o yokken yardım eder
    if (hasSeller && DEM[p] <= 0 && G.counter[p] >= 2) continue;
    if (have > 0 && room > 0 && DEM[p] > 0 && !claimed(s.id, p, n)) consider({ score:1000 + DEM[p] * 50, src:s.id, item:p, dst:'counter', amount:Math.min(carCap(n), room) });
    if (have > 0 && room > 0 && !claimed(s.id, p, n)) consider({ score:100 + have * 5, src:s.id, item:p, dst:'counter', amount:Math.min(carCap(n), room) });
  }
  // ara ürün (un, hamur): üretildiği istasyondan aynı binada onu kullanan istasyona
  for (const pr of STATIONS) {
    if (!active(pr) || pr.shop !== sh || !INTER[pr.out]) continue;
    const item = pr.out, avail = G.st[pr.id].out - claimedAmount(pr.id, item, n);
    if (avail <= 0) continue;
    for (const s of STATIONS) {
      if (!active(s) || s.shop !== sh || !s.recipe[item]) continue;
      const deficit = binCap() - G.st[s.id].bins[item] - incoming(s.id, item);
      if (deficit <= 0) continue;
      // tüketen istasyon aç kalmışsa (kutusunda bir pişirimlik bile yok) en öne: zincirin geri kalanı ona bağlı
      const starving = G.st[s.id].bins[item] < s.recipe[item], downstream = INTER[s.out] || DEM[s.out] > 0;
      const w = (DEM[s.out] > 0 ? 3 : 1) * (G.st[s.id].bins[item] < s.recipe[item] * 2 ? 2 : 1);
      consider({ score:(starving && (downstream || automated) ? 1500 : 400 + w * 60) + deficit, src:pr.id, item, dst:s.id, amount:Math.min(carCap(n), deficit, avail) });
    }
  }
  // hammadde: ambar → istasyon
  for (const s of STATIONS) {
    if (!active(s) || s.shop !== sh) continue;
    for (const m of Object.keys(s.recipe)) {
      if (!MATS[m]) continue;
      const avail = G.depot[m] - claimedAmount(DEPOT_SRC, m, n), deficit = binCap() - G.st[s.id].bins[m] - incoming(s.id, m);
      if (avail <= 0 || deficit <= 0) continue;
      const w = matPriority(m) * (s.kind === 'oven' && DEM[s.out] > 0 ? 1.5 : 1);
      consider({ score:380 + w * 50 + deficit + (automated&&G.st[s.id].bins[m]<s.recipe[m]?900:0), src:DEPOT_SRC, item:m, dst:s.id, amount:Math.min(carCap(n), deficit, avail) });
    }
  }
  if(automated&&sh===0&&G.unlocked.cafe){
    const index=cafeTables().findIndex((t,i)=>t.dirty&&!t.guest&&!carriers.some(o=>o!==n&&o.task?.kind==='clean'&&o.task.table===i)&&!(GAR.task?.kind==='clean'&&GAR.task.table===i));
    if(index>=0)consider({kind:'clean',table:index,dst:'cafe',amount:1,score:950});
  }
  return best;
}
function updateCarrier(n, dt) {
  if (n.state === 'idle') {
    n.task = chooseCarrierTask(n);
    if (n.task) n.state = n.task.kind==='clean'?'clean':'fetch';
    else { walk(n, n.home.x, n.home.y, carSpd(n), dt); n.status = n.moving ? '' : 'İş bekliyor'; return; }
  }
  if(n.task?.kind==='clean'){
    const i=n.task.table,ts=tableState[i],table=TABLES[i];
    if(!ts.dirty||ts.guest){n.task=null;n.state='idle';n.cleaning=-1;n.status='';return;}
    walk(n,table.x+34,table.y+4,carSpd(n),dt);n.status='Masa siliyor';n.cleaning=i;
    if(!n.moving){ts.cleanT+=dt;if(ts.cleanT>=1.1){ts.dirty=false;ts.cleanT=0;n.task=null;n.state='idle';n.cleaning=-1;n.status='';addXp(n.k,'Çırak');}}
    return;
  }
  n.cleaning=-1;
  const t = n.task, fromDepot = t.src === DEPOT_SRC, src = fromDepot ? null : ST[t.src];
  const srcPt = fromDepot ? depotPoint(n) : { x:zoneOf(src).x + n.off, y:zoneOf(src).y };
  if (n.state === 'fetch') {
    walk(n, srcPt.x, srcPt.y, carSpd(n), dt);
    n.status = '';
    if (!n.moving) {
      const got = n.carry.filter(x => x === t.item).length;
      let busy;
      if (fromDepot) {
        busy = got < t.amount && G.depot[t.item] > 0 && n.carry.length < carCap(n);
        if (busy && (n.actT = (n.actT || 0) + dt * .6) >= .085) { n.actT = 0; G.depot[t.item]--; n.carry.push(t.item); fly('item', t.item, depotBinPos(t.item).x, depotBinY(t.item) - 6, cp(n).x, cp(n).y, .22); }
      } else busy = pickFrom(n, n.carry, src, carCap(n), dt * .6, .085, t.amount - got);
      if (!busy) { if (n.carry.length) n.state = 'deliver'; else { n.state = 'idle'; n.task = null; } }
    }
  } else if (n.state === 'deliver') {
    if (!n.carry.length) { addXp(n.k, 'Çırak'); n.state = 'idle'; n.task = null; return; }
    let ok;
    if (t.dst === 'counter') { const D = DROPS[n.shop || 0]; walk(n, D.x + D.w / 2 + n.off, D.y + 24, carSpd(n), dt); ok = n.moving || dropCounter(n, n.carry, dt * .6); }
    else if (t.dst === 'stand') { walk(n, STAND_DROP.x + STAND_DROP.w / 2 + n.off, STAND_DROP.y + 20, carSpd(n), dt); ok = n.moving || dropStand(n, n.carry, dt * .6); }
    else { const s = ST[t.dst], z = zoneOf(s); walk(n, z.x + n.off, z.y, carSpd(n), dt); ok = n.moving || depositTo(n, n.carry, s, dt * .6, .07, x => x === t.item); }
    if (!ok) { n.stuckT = (n.stuckT || 0) + dt; n.status = 'Yer yok'; if (n.stuckT > 1.5) { n.stuckT = 0; n.state = 'return'; } }
    else n.stuckT = 0;
  } else if (n.state === 'return') {   // sığmayanı geldiği yere (tepsi ya da ambar) geri koy
    walk(n, srcPt.x, srcPt.y, carSpd(n), dt);
    n.status = 'Geri bırakıyor';
    if (!n.moving) {
      n.actT = (n.actT || 0) + dt;
      if (n.actT >= .1) {
        n.actT = 0; const t2 = n.carry.pop();
        if (t2 !== undefined) {
          if (fromDepot) { G.depot[t2]++; fly('item', t2, n.x, n.y - 20, depotBinPos(t2).x, depotBinY(t2) - 6, .2); }
          else { G.st[src.id].out++; fly('item', t2, n.x, n.y - 20, srcPt.x, srcPt.y - 4, .2); }
        }
      }
      if (!n.carry.length) { n.state = 'idle'; n.task = null; }
    }
  }
}

/* ================= Toplayıcı: talebe göre hammadde toplar, ambara getirir ================= */
// Puan: istasyonlarda eksik olan (talep ve boş kutu ağırlıklı) − ambarda zaten olan. Acil iş yoksa ambarı doldurur (boş beklemez).
function matScores() {
  const sc = {};
  for (const m of MAT_ORDER) {
    if (!NODES.some(nd => nd.m === m && nodeOpen(nd) && nd.amt > 0) || !matOpen(m) || !STATIONS.some(s => active(s) && s.recipe[m] !== undefined) || !depotRoom(m)) continue;
    const inTransit = gatherers.reduce((a,n) => a + n.carry.filter(t => t === m).length, 0);
    const urgent = Math.max(0, needFor(m) - G.depot[m] - inTransit) * matPriority(m);
    sc[m] = urgent * 10 + (depotCap() - G.depot[m]);
  }
  return sc;
}
function updateGatherer(n, dt) {
  n.gNode = null;
  if (n.state === 'gather') {
    if (!n.carry.length) {
      const score = matScores();
      const others = gatherers.filter(o => o !== n).map(o => o.mat);
      n.mat = Object.keys(score).sort((a, b) => score[b] * (others.includes(b) ? .4 : 1) - score[a] * (others.includes(a) ? .4 : 1))[0] || null;
      const otherCarry = gatherers.filter(o => o !== n).reduce((a, o) => a + o.carry.filter(x => x === n.mat).length, 0);
      n.goal = n.mat ? Math.max(1, Math.min(gatCap(), depotCap() - G.depot[n.mat] - otherCarry)) : 0;
    }
    const nodes = n.mat ? NODES.filter(nd => nd.m === n.mat && nd.amt > 0 && nodeOpen(nd)) : [];
    if (n.carry.length && (n.carry.length >= n.goal || !nodes.length)) n.state = 'deliver';
    else if (nodes.length) {
      const nd = nodes.sort((a, b) => dist2(n, a.x, a.y) - dist2(n, b.x, b.y))[0];
      walk(n, nd.x - 22, nd.y + 6, gatSpd(n), dt); n.status = '';
      if (!n.moving) { n.fx = 1; n.fy = 0; gather(n, n.carry, n.goal, dt, gatTime, n.mat); }
    } else {
      walk(n, n.home.x, n.home.y, gatSpd(n), dt);
      n.status = n.mat ? `${MATS[n.mat].name} bekliyor` : 'Ambar dolu';
    }
  }
  if (n.state === 'deliver') {
    if (!n.carry.length) { addXp(n.k, 'Toplayıcı'); n.state = 'gather'; return; }
    const i = gatherers.indexOf(n);
    walk(n, DEPOT.x + 30, DEPOT.y + 130 + i * 30, gatSpd(n), dt);
    n.status = '';
    if (!n.moving) {
      const k = n.carry.findIndex(depotRoom);
      if (k < 0) { n.status = 'Ambar dolu'; return; }

/* ================= Kasiyer (köy fırını) ve şube müdürü (Çarşı şubesi) ================= */
// Görevleri: fırından ürünü alıp vitrine koymak ve müşteriye satmak.
//  counter → tezgahta: satış yapar; sıradaki müşterinin istediği vitrinde yoksa fırına gider; müşteri yoksa vitrini tamamlar
//  fetch   → fırının tepsisinden ürünü tepsisine alır
//  back    → vitrine döner, ürünü bölmesine koyar (köy fırınında özel sipariş sepetine de)
// Kasiyer fırına gittiğinde satış durur (yeşil alandaysan satışı sen yaparsın).
const mkCashier = (shop, unlock, xp, look) => ({ shop, unlock, xp, look, isCashier:true, home:CASHIERS[shop], x:CASHIERS[shop].x, y:CASHIERS[shop].y, tx:CASHIERS[shop].x,
  fx:0, fy:1, phase:0, moving:false, wait:1, turn:1, state:'counter', carry:[], task:null, busy:false, anim:0, item:'ekmek' });
const CS = mkCashier(0, 'cash', 'cash', { dress:'#8a3f3f', skin:SKIN[0], hair:HAIR[2] });
const CS2 = mkCashier(1, 'cs2', 'cash2', { dress:'#3f5a8a', skin:SKIN[1], hair:HAIR[3], cap:'#f2ede4' });
const CSS = [CS, CS2];
const CASH_CAP = 4;
const cashSpeed = () => 80 * (1 + .12 * G.lv.cashSpd);
function cashierTask(cs) {
  const FRONT = SV[cs.shop].front, ovens = cs.shop ? OVENS1 : OVENS0;
  // 1) sıradaki müşterinin istediği vitrinde yok ve yolda gelmiyorsa: fırından al
  if (FRONT && G.counter[FRONT.want] <= 0 && beltIncomingCounter(FRONT.want) === 0) {
    const s = ovens.find(o => active(o) && o.out === FRONT.want && G.st[o.id].out > 0);
    if (s) return { s, amount:Math.max(1, Math.min(CASH_CAP, FRONT.n - FRONT.got + 1, crateCap() - G.counter[s.out])) };
  }
  // 2) özel sipariş varsa (köy fırını): eksik ürünü fırından alıp sipariş sepetine koy
  if (cs.shop === 0 && ORDER && !ORDER.gold && (!FRONT || G.counter[FRONT.want] > 0)) {
    for (const p of Object.keys(ORDER.items)) {
      const left = orderLeft(ORDER, p); if (left <= 0) continue;
      const s = ovens.find(o => active(o) && o.out === p && G.st[o.id].out > 0);
      if (s) return { s, amount:Math.min(CASH_CAP, left, G.st[s.id].out), dst:'order' };
    }
  }
  // 3) müşteri beklemiyorsa: vitrinde azalan ürünü (önce talep) fırından tamamla
  if (!FRONT || G.counter[FRONT.want] > 0) {
    let best = null, bs = 0;
    for (const o of ovens) {
      if (!active(o) || G.st[o.id].out <= 0) continue;
      const room = crateCap() - G.counter[o.out] - beltIncomingCounter(o.out);
      if (room <= 0 || G.counter[o.out] >= 3 && DEM[o.out] <= 0) continue;
      const sc = (DEM[o.out] > 0 ? 100 + DEM[o.out] : 0) + (3 - Math.min(3, G.counter[o.out])) * 10 + G.st[o.id].out;
      if (sc > bs) { bs = sc; best = { s:o, amount:Math.min(CASH_CAP, room, G.st[o.id].out) }; }
    }
    return best;
  }
  return null;
}
function updateCashier(cs, dt) {
  if (!G.unlocked[cs.unlock]) return;
  cs.anim = Math.max(0, cs.anim - dt * 3);
  const spd = cashSpeed() * xpMul(cs.xp), home = cs.home;
  let tx = cs.tx, ty = home.y;
  if (cs.state === 'counter') {
    if (!cs.busy && cs.anim === 0) {
      const t = cashierTask(cs);
      if (t) { cs.task = t; cs.state = 'fetch'; }
    }
    if (cs.state === 'counter') {
      if (cs.busy || cs.anim > 0) tx = 168;
      else if ((cs.wait -= dt) <= 0) { cs.tx = tx = 108 + Math.random() * 80; cs.wait = 1.6 + Math.random() * 2.6; cs.turn = Math.random() < .5 ? -1 : 1; }
      cs.tx = tx;
    }
  }
  if (cs.state === 'fetch') {
    const s = cs.task.s, z = zoneOf(s); tx = z.x - 12; ty = z.y;
    if (cs.x === tx && cs.y === ty) {
      const busy = pickFrom(cs, cs.carry, s, CASH_CAP, dt, .12, cs.task.amount - cs.carry.length);
      if (!busy) cs.state = 'back';
    }
  }
  if (cs.state === 'back') {
    const toOrder = cs.task && cs.task.dst === 'order';
    if (toOrder) { tx = BASKET.x - 24; ty = BASKET.y; } else { tx = 240; ty = home.y; }   // sipariş sepeti ya da yeşil alanın sol ucu (vitrin)
    if (cs.x === tx && cs.y === ty) {
      const busy = cs.carry.length && (toOrder ? deliverToOrder(cs, cs.carry, dt, .1) : dropCounter(cs, cs.carry, dt, .1));
      if (!cs.carry.length || !busy) {
        // vitrinde yer yoksa kalanı fırına geri bırakır
        for (const t of cs.carry.splice(0)) { const o = OVENS.find(x => x.out === t); G.st[o.id].out++; }
        addXp(cs.xp, cs.shop ? 'Şube müdürü' : 'Kasiyer'); cs.state = 'counter'; cs.task = null; cs.tx = 168;
      }
    }
  }
  // yürüme
  const dx = tx - cs.x, dy = ty - cs.y, d = Math.hypot(dx, dy), st = spd * dt;
  cs.moving = d > st;
  if (cs.moving) { cs.x += dx / d * st; cs.y += dy / d * st; cs.fx = dx / d; cs.fy = dy / d; cs.phase += dt * 12; }
  else {
    cs.x = tx; cs.y = ty;
    if (cs.state !== 'counter') { cs.fx = 0; cs.fy = cs.state === 'fetch' ? -1 : 1; }
    else if (cs.busy || cs.anim > 0) { cs.fx = .3; cs.fy = 1; }
    else { cs.fx = Math.sin(time * .9) * .5 * cs.turn; cs.fy = 1; }
  }
}


/* ================= Traktör / biçerdöver ================= */
// Başaklı en yakın tarla noktasına gider, biçer; kasası dolunca (ya da tarlada başak kalmayınca) çiftlik kapısında ambara boşaltır.
// Biçerdöver iki kat hızlı ve geniştir: bir noktayı biçerken yanındakilerden de alır. Ambar doluysa bekler.
const TR = { x:795, y:790, home:{ x:795, y:790 }, fx:1, fy:0, state:'park', carry:0, node:null, t:0, moving:false, status:'' };
function goStraight(e, tx, ty, spd, dt) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy), st = spd * dt;
  if (d > st) { e.x += dx / d * st; e.y += dy / d * st; e.fx = dx / d; e.fy = dy / d; e.moving = true; return false; }
  e.x = tx; e.y = ty; e.moving = false; return true;
}
function updateTractor(dt) {
  if (!G.unlocked.traktor) return;
  const big = !!G.unlocked.bicer, spd = (110 + 18 * G.lv.trSpd) * (big ? 1.25 : 1), hT = (big ? .14 : .28) / usta();
  const room = depotCap() - G.depot.bugday - ridingTo('depot', 'bugday') - TR.carry;
  TR.status = '';

    if (goStraight(TR, 790, 455, spd, dt)) {

      if ((TR.t += dt) >= .08) {

        else if (TR.carry > 0) TR.status = 'Ambar dolu';

      if (TR.carry === 0) TR.state = 'park';
    }
    return;
  }
  if (TR.carry >= trCap() || (TR.carry > 0 && room <= 0)) { TR.state = 'unload'; return; }
  let nd = TR.node;
  if (!nd || nd.amt <= 0 || !nodeOpen(nd) || nodeBlocked(nd)) {
    nd = NODES.filter(n => n.m === 'bugday' && n.amt > 0 && nodeOpen(n) && !nodeBlocked(n)).sort((a, b) => dist2(TR, a.x, a.y) - dist2(TR, b.x, b.y))[0] || null;
    TR.node = nd;
  }
  if (!nd || room <= 0) {
    if (TR.carry > 0) { TR.state = 'unload'; return; }
    TR.state = 'park'; goStraight(TR, TR.home.x, TR.home.y, spd, dt);
    TR.status = room <= 0 ? 'Ambar dolu' : mishapAt('karga') ? 'Kargalar tarlada!' : 'Başak bekliyor'; return;
  }

        if (nb) { nb.amt--; TR.carry++; chips(nb.x, nb.y, '#e8c25a', 3); }
      }
    }
  }
}

const productionReady = Object.fromEntries(STATIONS.map(s => [s.id, true]));

function planProduction() {
  const stock = zeroProducts(), demand = zeroProducts();
  const count = items => { for (const p of items) if (PRODUCTS[p]) stock[p]++; };
  for (const p of PROD_ORDER) stock[p] = G.counter[p] + G.stand[p];
  for (const s of OVENS) stock[s.out] += G.st[s.id].out;
  count(G.carry); count(G.vanLoad); count(GAR.carry);
  for (const n of carriers) count(n.carry);
  for (const n of CSS) count(n.carry);
  for (const r of riders) if (PRODUCTS[r.item]) stock[r.item]++;
  for (const b of Object.values(G.br)) for (const p of PROD_ORDER) stock[p] += b.stock[p];
  for (const c of customers) if (c.state !== 'leave') demand[c.want] += Math.max(0,c.n-c.got);
  for (const g of guests) if (['wait','in'].includes(g.state)) demand[g.want] += Math.max(0,g.n-g.got);
  for (const order of [ORDER,G.journal.active]) if (order && !order.gold) for (const p in order.items) demand[p] += Math.max(0,order.items[p]-order.got[p]);
  for (const s of STATIONS) productionReady[s.id] = PRODUCTS[s.out]

}

  if (joy) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy); if (d > 6) { const m = Math.min(1, d / 50); ix = dx / d * m; iy = dy / d * m; } }

  for (const s of STATIONS) {
    if (!active(s)) continue;
    if (!productionReady[s.id] || G.st[s.id].out >= outMax() || !canBake(s) || (UM && UM.s === s)) continue;

  serveTables(P, G.carry, dt);

  computeDemand();
  playerDepot(dt);
  updateBelts(dt);
  for (const n of carriers) updateCarrier(n, dt);
  for (const n of gatherers) updateGatherer(n, dt);
  updateCustomers(dt);
  updateGuests(dt);
  updateOrder(dt);
  updateUsta(dt);
  updateMishaps(dt);
  updateGuide(dt);
  for (const cs of CSS) updateCashier(cs, dt);
  updateGarson(dt);
  updateKalfa(dt);
  updateTractor(dt);
  updateStandBuyers(dt);
  updateVan(dt);
  updateBranches(dt);
  updateCritters(dt);
  updateBanter(dt);
  checkQuests(dt);

  // altın yığınları: köy fırınınınki ve Çarşı şubesininki; üstünde durunca kesene akar
  let atPile = null;

  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; if (f.t > 1.1) floats.splice(i, 1); }
  for (let i = speech.length - 1; i >= 0; i--) if ((speech[i].t += dt) > speech[i].life) speech.splice(i, 1);
  for (let i = confetti.length - 1; i >= 0; i--) { const c = confetti[i]; c.t += dt; c.vy += 420 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += dt * 8; if (c.t > 1.4) confetti.splice(i, 1); }

}

  for(const p of PROD_ORDER)for(const n of [10,50,150])if(raw.claimed?.[p+':'+n]===true)j.claimed[p+':'+n]=true;
  for(const id in REGULAR_BY_ID)if(raw.regulars?.[id])j.regulars[id]={visits:NAT(raw.regulars[id].visits)};
  const readContract=c=>{
    if(!c||!Number.isFinite(c.reward)||c.reward<=0||!c.items||typeof c.items!=='object')return null;
    const entries=Object.entries(c.items);if(!entries.length||entries.length>2||entries.some(([p,n])=>!PRODUCTS[p]||!Number.isInteger(n)||n<1||n>40))return null;
    const name=CONTRACT_CLIENTS.includes(c.client)?c.client:CONTRACT_CLIENTS[0];

  };

function ensureContracts() {
  const j=G.journal;if(j.active||j.offers.length)return;
  const products=OVENS.filter(active).map(s=>s.out),serial=j.completed;
  j.offers=[0,1,2].map(i=>{

}

}
function deliverContract() {
  const j=G.journal,c=j.active;if(!c)return false;let sent=0;
  for(const p in c.items){
    let need=c.items[p]-c.got[p],n=0;const oven=OVENS.find(s=>s.out===p);
    for(const [stock,reserve]of [[oven?G.st[oven.id]:null,0],[G.stand,2],[G.counter,2]]){
      if(!stock||!need)continue;
      const key=stock===G.st[oven?.id]?'out':p;
      const take=Math.min(need,Math.max(0,stock[key]-reserve));stock[key]-=take;need-=take;n+=take;
    }
    for(let i=G.carry.length-1;i>=0&&need;i--)if(G.carry[i]===p){G.carry.splice(i,1);need--;n++;}
    c.got[p]+=n;G.stats[p]+=n;sent+=n;
  }
  if(Object.keys(c.items).every(p=>c.got[p]>=c.items[p])){
    // Aktif sözleşme önce kapatılır; aynı düğmeye yeniden basmak ödülü tekrarlamaz.

    earn(c.reward,Object.values(c.items).reduce((a,n)=>a+n,0),'direct');addRep(.06);

// Bütün ilerleme tek satırlık bir koda çevrilir: KF2- (sıkıştırılmış) ya da KF1- (sıkıştırma desteklenmiyorsa düz).
// Kod sunucuya gitmez; oyuncu kopyalayıp kendisi saklar, istediği cihazda yapıştırarak geri yükler.
const toB64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pipeBytes(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function makeSaveCode() {
  save();
  const raw = new TextEncoder().encode(JSON.stringify(G));
  try { if (window.CompressionStream) return 'KF2-' + toB64(await pipeBytes(raw, new CompressionStream('deflate-raw'))); } catch (e) {}
  return 'KF1-' + toB64(raw);
}
async function readSaveCode(code) {
  code = code.replace(/\s+/g, '');
  const kind = code.slice(0, 4), body = fromB64(code.slice(4));
  const raw = kind === 'KF2-' ? await pipeBytes(body, new DecompressionStream('deflate-raw')) : kind === 'KF1-' ? body : null;
  if (!raw) throw new Error('kod');
  return normalize(JSON.parse(new TextDecoder().decode(raw)));
}
async function openBackup() {
  const code = await makeSaveCode();
  modal(`<h2>Kaydı yedekle</h2>

// İşletme durumu Menü içinde; mobil araç çubuğu üç satırı aşmaz.
for (const [label,delta] of [['−',-.1],['+',.1]]) { const b=document.createElement('button'); b.textContent=label; b.className='zoom'; b.setAttribute('aria-label',delta < 0 ? 'Uzaklaştır' : 'Yakınlaştır'); b.onclick=() => {G.viewScale=Math.max(.6,Math.min(1.3,Math.round((G.viewScale+delta)*10)/10));resize();save();}; tools.appendChild(b); }
tools.appendChild($('#pauseBtn')); $('#pauseBtn').appendChild(document.createTextNode(' Menü'));
$('#pauseBtn').addEventListener('click', openMenu);
// Panel ve menü düğmelerinde hafif tık sesi
document.addEventListener('click', e => { if (e.target.closest('#modal button, #deskTabs button, #mobileTools button, #deskClose, .vTabs button')) sfx('click', .7); }, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) { paused = true; joy = null; save(); } else { paused = !modalEl.hidden; lastT = performance.now(); } });
addEventListener('pagehide', save);
addEventListener('pageshow', () => { lastT = performance.now(); });
// Ana ekrandaki uygulama çoğu zaman yeniden yüklenmeden devam eder.
let updateCheckRunning = false, lastUpdateCheck = 0;
async function checkGameUpdate() {
  if (document.hidden || updateCheckRunning || Date.now() - lastUpdateCheck < 30000) return;
  updateCheckRunning = true; lastUpdateCheck = Date.now();
  try {
    const response = await fetch('./index.html', {cache: 'no-store'});
    if (!response.ok) return;
    const version = (await response.text()).match(/const GAME_VERSION = '(v\d+)'/);
    if (!version || Number(version[1].slice(1)) <= Number(GAME_VERSION.slice(1)) || $('#gameUpdate')) return;
    const button = document.createElement('button');
    button.id = 'gameUpdate'; button.textContent = version[1] + ' hazır · Kaydet ve güncelle';
    button.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:10000;max-width:92vw;background:#195c40;color:white;padding:12px 16px;border:2px solid #fff;border-radius:14px;box-shadow:0 3px 18px #0006';
    const apply = () => {
      save();
      try { if (localStorage.getItem(KEY) !== JSON.stringify(G)) throw new Error('save'); }
      catch (_) { button.textContent = 'Kayıt yapılamadı; güncelleme bekletildi'; return false; }
      location.reload(); return true;
    };
    button.onclick = apply;
    document.body.appendChild(button);
    // Yeni sürüm bulununca oyuncu bir şey yapmadan kaydedilip güncellenir; kayıt doğrulanamazsa düğme elle denemek için kalır.
    button.textContent = version[1] + ' yükleniyor · kaydın korunuyor';
    setTimeout(apply, 1200);
  } catch (_) { /* Çevrimdışıyken kayıtlı oyun devam eder. */ }
  finally { updateCheckRunning = false; }
}
addEventListener('pageshow', checkGameUpdate);
addEventListener('online', checkGameUpdate);
document.addEventListener('visibilitychange', checkGameUpdate);

new ResizeObserver(resize).observe(app);
new ResizeObserver(() => { $('#recipe').style.top = ($('#hud').offsetHeight + 12) + 'px'; }).observe($('#hud'));

/* ================= Döngü ================= */
let lastT = performance.now(), saveT = 0, lastPaint = -Infinity, hudTime = 0;
// Döngü önce bir sonraki kareyi ister: bir karede hata olsa bile oyun durmaz (hata konsola bir kez yazılır).
let frameErr = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { lastT = now; return; }
  const minFrameMs = G.lightGraphics || Math.min(vw,vh) < 600 ? 1000/30 : 1000/60;
  if (now - lastPaint < minFrameMs - .5) return;
  lastPaint = now - (now - lastPaint < minFrameMs * 2 ? (now - lastPaint) % minFrameMs : 0);
  const dt = Math.min(.1, Math.max(0, (now - lastT) / 1000)); lastT = now;
  try {
    if (!paused) { update(dt); if ((saveT += dt) > 4) { saveT = 0; save(); } }
    render();
    if ((hudTime += dt) >= .15) { hud(hudTime); hudTime = 0; }
    updateMusic();
  } catch (e) { if (!frameErr) { frameErr = true; console.error('Köy Fırını kare hatası:', e); } }
}
function start(data) {
  G = normalize(data && data.G) || load() || fresh();
  ORDER = G.order;
  ensureTransit();
  P.x = G.px; P.y = G.py; if(P.x>636&&P.x<738&&P.y>488&&P.y<728)P.x=630; collide(P, 12);
  if (G.unlocked.car) addCarrier(0);
  if (G.unlocked.car2) addCarrier(1);
  if (G.unlocked.gat) addGatherer(0);
  if (G.unlocked.gat2) addGatherer(1);
  if (G.unlocked.car3) addCarrier(2);
  // Yük açılışta ışınlanmaz; kaydedilen yolculuk ve pişirme kaldığı yerden sürer.
  const sim=G.simulation;
  for(const s of STATIONS) bakeT[s.id]=Number.isFinite(sim?.bake?.[s.id])?Math.max(0,Math.min(bakeInt(s),sim.bake[s.id])):0;
  const van=sim?.van;
  if(van&&['park','load','go','away','back'].includes(van.state)) {
    VAN.state=van.state;
    for(const k of ['x','t','wait','till'])if(Number.isFinite(van[k]))VAN[k]=van[k];
  } else if(G.vanLoad.length) { VAN.state='go'; VAN.x=VAN.home; }
  resize();
  try { document.fonts?.ready.then(() => { floor = null; resize(); }); } catch (e) {}   // tabela yazıları asıl yazı tipiyle yeniden çizilsin
  if (!G.intro) openIntro();
  else if (G.seenVersion !== GAME_VERSION) openWhatsNew();
  planProduction();
  requestAnimationFrame(frame);
}
// Geliştirici testi: yalnızca adres ?debug ile açılınca konsoldan durum ve olaylara erişim
if (/[?&]debug\b/.test(location.search)) window.KF = { get G() { return G; }, P, get mishaps() { return mishaps; }, get UM() { return UM; }, get ORDER() { return ORDER; },
  spawnMishap, newOrder, ustaPress, resolveUsta, complete:id => complete(OFFER[id]),
  get audio() { return { state:ac && ac.state, loaded:Object.keys(AUD.buf).sort(), music:AUD.musicName, amb:Object.keys(AUD.amb) }; }, teleport:(x, y) => { P.x = x; P.y = y; }, setDay:(d, t = 20) => { G.day = d; G.dayT = t; } };
try { window.claude?.hot?.snapshot?.(() => { G.px = P.x; G.py = P.y; return { G }; }); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
