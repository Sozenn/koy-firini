ağını sürükleyerek, bilgisayarda <b>W A S D</b> ya da ok tuşlarıyla yürü. <b>P</b> ya da <b>Esc</b> duraklatır, <b>Q</b> elindekileri bırakır, <b>Boşluk</b> ya da <b>E</b> usta işi pişirir.</li>\n  <li>Sağ duvardaki kapıdan <b>çiftliğe</b> çık. Tarladan buğday biç, kuyudan su çek. Yanında durman yeter.</li>\n  <li>Kapının altındaki <b>ambara</b> elinde hammaddeyle girersen hepsi ambara konur. Elin boş girersen üretimin ihtiyacı olan malzemeler ambardan eline alınır.</li>\n  <li>Buğdayı <b>değirmenin</b> önündeki daireye getir: un olur. Unu ve suyu <b>ekmek fırınının</b> önüne götür. Her istasyonun malzeme kutuları kendi önündedir; kutular dolunca istasyon kendiliğinden çalışır.</li>\n  <li>Tepsideki ürünleri al, vitrinin arkasındaki <b>yeşil alana</b> bırak. Altın yığınının üstünde durup paranı topla.</li>\n  <li><b>Al / Bırak 📦</b>: kasanın, vitrinin, tezgâhın ya da sipariş sepetinin yanında <b>📦 Al / Bırak</b> düğmesine bas (bilgisayarda <b>T</b>). Üstteki ürüne <b>dokun</b>: eline alırsın. Alttaki elindeki ürüne <b>dokun</b>: buraya bırakırsın. Basılı tutarsan hızlıca çok taşır. <b>Çalışanlar neyi taşısın?</b> menüsünden bir ürünü kendin taşımayı seçebilirsin.</li>\n  <li><b>Mahalleliler 💬</b>: sokakta ve tarlada yaşayan dört mahalleli var. Yanlarına gidince <b>Konuş</b> düğmesi (bilgisayarda <b>F</b>) çıkar. Başlarında <b>!</b> olanın bir hikâyesi, <b>✉</b> olanın mektubu vardır.</li>\n  <li><b>Mevsimler 🌸☀️🍂❄️</b>: her mevsim 7 gün sürer. Mevsime göre farklı ürünler çok aranır; her mevsimin 4. günü mahalle şenliği olur. Üstteki gün şeridinde mevsimin simgesi görünür.</li>\n  <li><b>Büyük işletme 📈</b>: <b>Menü → Çalışan uzmanlıkları</b> (3. seviyede uzmanlık seç), <b>Mahalle panosu → Tarifler</b> (tarifi geliştir, fiyat artar), <b>Menü → Fiyat politikası</b> (ucuz, normal, premium).</li>\n  <li><b>Usta işi ✦</b>: Usta rafını kurunca bir fırının önünde dururken <b>Usta işi</b> düğmesine bas. Dönen ibreyi <b>altın dilimde</b> durdurursan ürün altın olur. Altın ürünleri <b>usta rafına</b> diz: gurme müşteriler normal fiyatın 3 katını öder. Bunu hiçbir çalışan ya da makine yapamaz.</li>\n  <li><b>Usta siparişi</b>: ara sıra şapkalı bir müşteri yalnızca altın ürün ister. Altın ürünleri vitrinin sağ arkasındaki sepete koy; süre bitmeden tamamlarsan büyük ödül ve mahalle pulu kazanırsın.</li>\n  <li><b>Aksilikler</b>: otomasyon kurulunca bazen kargalar tarlaya konar, tilki kümese dadanır, bacayı is basar ya da değirmen taşı körelir. Ekranın üstünde uyarı çıkar, kırmızı ok yerini gösterir. Gidip yanında durunca çözülür ve mahalleliler teşekkür eder.</li>\n  <li>Çalışanlar müşterilere göre çalışır: <b>çırak</b> önce beklenen ürünü taşır, <b>toplayıcı</b> önce eksik malzemeyi getirir. Geliştirmeler ve çalışanlar için <b>usta masasına</b> git; yeni fırınlar ve çiftlik alanları yerdeki dairelerle açılır.</li>\n  <li>Usta masasının <b>Sevkiyat</b> sekmesinden bantları (ürün bandı, buğday ve un bantları, malzeme dağıtımı), <b>Çiftlik</b> sekmesinden traktörü alarak işi otomatikleştirebilirsin. Bantlar haritada görünür; eşyalar üstlerinde kayar. <b>Akış</b> düğmesi hatları listeler.</li>\n  <li><b>Gün döngüsü:</b> bir gün 3 dakika. Sabah ekmek, akşam pasta daha çok aranır. Gece müşteri gelmez, çalışanlar stok hazırlar.</li>\n  <li><b>İtibar (yıldız):</b> hızlı hizmet ve gurme müşteriler yıldız kazandırır, kızgın giden müşteri düşürür. Yıldız arttıkça müşteri ve bahşiş artar.</li>\n  <li><b>Kafe:</b> misafirlere istedikleri ürünü masaya götür, kirli masanın yanında durarak sil. <b>Garson</b> tutarsan bunları o yapar.</li>\n  <li><b>Kendin al tezgahı:</b> fazla ürünleri ön kapının yanındaki tezgaha koy; sokaktan gelenler kendileri alır.</li>\n  <li><b>Mahalle panosu:</b> süre sınırı olmayan siparişler al, müdavimlerini tanı, ustalık rozetleri ve tasarım temaları kazan.</li>\n  <li><b>Yeni arazi ve Çarşı şubesi:</b> çitteki kapıdan arı kovanlarına, fındık bahçesine ve zeytinliğe; fırının ön kapısından çarşı yoluna ve şubeye geçilir. Şubede
