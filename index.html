<meta name="theme-color" content="#120e0b">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>html,body{margin:0;padding:0;background:#120e0b}[hidden]{display:none!important}
/* ana ekrandan açılınca çentik ve alt çubuk altında kalmasın */
#hud{padding-top:max(10px,env(safe-area-inset-top))!important;padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}</style>
<style>
html,body,#app{height:100%;height:100dvh}
#hud{flex-wrap:wrap;align-items:center}
#hud .hl{flex-direction:row;flex-wrap:wrap;max-width:100%}
#goal{flex-basis:100%;order:2;white-space:normal}
#mobileTools{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:10;display:grid;grid-template-columns:repeat(2,48px);gap:8px}
#mobileTools button{width:48px;height:48px;border:1px solid var(--line);border-radius:14px;background:#241c16ee;font-weight:800;font-size:18px;touch-action:manipulation}
#mobileTools #pauseBtn{width:104px;grid-column:1/-1;display:flex;gap:8px;justify-content:center;font-size:14px}
#mobileTools #bookBtn{font-size:11px;padding:0}
#recipe{top:112px;max-width:calc(100% - 24px);white-space:normal;flex-wrap:wrap}
#statusBtn{font-size:11px!important}
#modal{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));z-index:30}
#app #desk{z-index:25}
@media(max-width:420px){#cash{font-size:18px}#daypill{font-size:11px}#hud{gap:5px}#goal{font-size:11px}#recipe{font-size:11px}}
@media(max-height:480px){#hud .hl{flex-direction:row}#mobileTools{grid-template-columns:repeat(4,44px);gap:4px}#mobileTools button{width:44px;height:44px}#mobileTools #pauseBtn{grid-column:span 2;width:92px}#recipe{top:90px}}
</style></head>
<body>
<title>Köy Fırını</title>
<style>
/* Layout: tam ekran canvas fırın + çiftlik, üstte ince HUD şeridi, altta açılan usta masası paneli, sürükle-yürü joystick */
:root{
  --void:#120e0b; --stone:#2e2620; --ink:#f7efe2; --muted:#bfae98; --gold:#f2b544; --gold-deep:#b9861c;
  --ok:#8ccf4a; --bad:#e8643a; --panel:#1d1712; --line:#3d3229;
  --f-display:"Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;overflow:hidden;background:var(--void)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--f-body);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

#hud{position:absolute;left:0;right:0;top:0;padding:10px 16px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
#cash{display:flex;align-items:center;gap:8px;background:rgba(18,14,11,.75);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;
  font:800 22px/1 var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums;min-width:96px}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe48a,var(--gold) 45%,var(--gold-deep));border:2px solid #7a560f;flex:none}
#cash.pulse{animation:pulse .25s}
.hl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#daypill{display:flex;align-items:center;gap:8px;background:rgba(18,14,11,.75);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:800 12px/1 var(--f-display);color:var(--ink);white-space:nowrap}
#daypill .bar{width:44px;height:5px;border-radius:3px;background:var(--stone);overflow:hidden}
#daypill .bar i{display:block;height:100%;background:var(--gold)}
.stars{color:#5a4a3a;letter-spacing:-1px;font-style:normal}
.stars i{font-style:normal}.stars i.on{color:var(--gold)}.stars i.half{color:#b9861c}
#daycard{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(18,14,11,.92);border:1px solid var(--gold-deep);border-radius:16px;padding:14px 20px;text-align:center;max-width:86%}
#daycard b{font:800 20px var(--f-display);color:var(--gold)}
#daycard span{font-size:13.5px}
#daycard .stars{font-size:20px}
.quest{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.quest em{font-style:normal;color:var(--gold);font-weight:800}
.quest.done{opacity:.55}.quest.done span{color:var(--ok)}
@keyframes pulse{50%{transform:scale(1.08)}}
#goal{flex:1;min-width:0;align-self:center;text-align:center;font:700 12.5px/1.3 var(--f-body);color:var(--ink);
  background:rgba(18,14,11,.62);border-radius:10px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal b{color:var(--gold)}
#dropBtn{pointer-events:auto;height:44px;padding:0 12px;border-radius:12px;background:var(--bad);color:var(--void);border:0;flex:none;font:800 13px var(--f-display)}
#bookBtn,#pauseBtn{pointer-events:auto;height:44px;border-radius:12px;background:rgba(18,14,11,.75);border:1px solid var(--line);flex:none}
#bookBtn{padding:0 12px;font:800 13px var(--f-display);color:var(--gold)}
#pauseBtn{width:44px;display:grid;place-items:center}
#pauseBtn svg{width:16px;height:16px;fill:var(--ink)}
#toast{position:absolute;left:50%;bottom:22%;transform:translate(-50%,20px);opacity:0;transition:.25s;z-index:9;max-width:86%;pointer-events:none;
  background:var(--ink);color:var(--void);font:800 14px/1.3 var(--f-display);padding:8px 14px;border-radius:999px;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Tarif kartı (istasyonun yanındayken) */
#recipe{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:6;max-width:calc(100% - 24px);pointer-events:none;white-space:nowrap;
  background:rgba(18,14,11,.78);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:800 13px/1.2 var(--f-display);
  display:flex;align-items:center;gap:6px;overflow:hidden}
#recipe .rc-c{display:inline-flex;align-items:center;gap:4px}
#recipe .rc-c.ok{color:var(--ok)} #recipe .rc-c.no{color:var(--bad)}
#recipe .rc-op{color:var(--muted)} #recipe em{font-style:normal;color:var(--gold);font-size:12px}
#recipe .rc-w{color:var(--bad);font-size:12px}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:800 15px/1.2 var(--f-display)}
.rc-h em{font-style:normal;color:var(--gold);font-size:13px;white-space:nowrap}
.rc-sub{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.rc-row{display:grid;grid-template-columns:16px 1fr auto;gap:2px 8px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.rc-row b{font:800 13px var(--f-display)}
.rc-row small{grid-column:2/4;font-size:11px;color:var(--muted)}
.rc-have{font:800 12px var(--f-display);white-space:nowrap}
.rc-have.ok{color:var(--ok)} .rc-have.no{color:var(--bad)}
.ic{width:14px;height:14px;display:inline-block;border-radius:4px}
.book-item{padding:8px 0;border-top:1px solid var(--line)}
.eq{font-size:13px;line-height:1.7}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;margin-right:2px}

/* Usta masası paneli */
#desk{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:62%;z-index:8;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
#desk .dhead{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
#desk .dhead b{font:800 18px/1.2 var(--f-display);color:var(--gold);flex:1}
#desk .dhead span{display:flex;align-items:center;gap:6px;font:800 15px var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums}
#desk .dhead .coin{width:18px;height:18px}
#deskClose{width:40px;height:40px;border-radius:10px;background:var(--stone);font:800 20px/1 var(--f-display)}
#deskTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 10px 8px}
#deskTabs button{padding:9px 2px;border-radius:9px;font:800 12.5px var(--f-display);color:var(--muted);position:relative}
#deskTabs button.on{background:var(--stone);color:var(--ink)}
#deskTabs button.dot::after{content:"";position:absolute;top:5px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
#deskList{overflow-y:auto;padding:0 12px 12px;overscroll-behavior:contain;touch-action:pan-y}
.row{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.ri{flex:1;min-width:0}
.rn{font:800 14.5px/1.25 var(--f-display);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font:700 11px var(--f-body);color:var(--muted);background:var(--stone);padding:2px 7px;border-radius:999px}
.ri p{margin:3px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.row.lock{opacity:.55}
.buy{flex:none;min-width:86px;min-height:46px;padding:6px 10px;border-radius:11px;background:var(--ok);color:var(--void);font:800 14px/1.1 var(--f-display);display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.buy small{font:700 10px var(--f-body);opacity:.8}
.buy.no{background:var(--stone);color:var(--muted)}
.buy.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.done{flex:none;min-width:86px;text-align:center;font:800 12px var(--f-display);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:2px;margin-top:5px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.25);color:var(--muted)}
.steps b{color:var(--ink);font-size:12px}
.steps .next{color:var(--gold)}
.row.lock{opacity:.8}
.row.lock .rn{color:var(--muted)}
.pri{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pri button{padding:7px 10px;border-radius:9px;background:var(--stone);font:800 12px var(--f-display);color:var(--ink)}
.pri button.on{background:var(--gold);color:var(--void)}

#modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(8,6,4,.72)}
#modal .box{width:min(400px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
#modal h2{margin:0 0 8px;font:800 23px/1.15 var(--f-display);color:var(--gold);text-wrap:balance}
#modal p,#modal li{font-size:14.5px;line-height:1.5}
#modal ol{padding-left:20px;margin:8px 0}
#modal .btns{display:grid;gap:8px;margin-top:14px}
#modal .btns button{padding:13px;border-radius:12px;background:var(--stone);border:1px solid var(--line);font:800 15px var(--f-display)}
#modal .btns button.pri{background:var(--gold);color:var(--void);border-color:var(--gold)}
#modal .btns button.danger{color:var(--bad)}
#modal textarea{width:100%;box-sizing:border-box;min-height:92px;margin-top:6px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--stone);color:inherit;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;resize:vertical}
#modal .note{font-size:13px;color:var(--muted)}
</style>

<div id="app">
  <canvas id="cv" aria-label="Oyun alanı. Parmağını sürükleyerek ya da WASD / ok tuşlarıyla yürü."></canvas>
  <div id="hud">
    <div class="hl">
      <div id="cash"><span class="coin"></span><span id="money">0</span></div>
      <div id="daypill"><span id="dayTxt">1. gün · Sabah</span><span class="bar"><i id="dayBar"></i></span><span class="stars" id="repStars"></span></div>
    </div>
    <div id="goal"></div>
    <button id="dropBtn" hidden aria-label="Elindekileri bırak (Q)">Bırak</button>
    <button id="bookBtn" aria-label="Tarif defteri">Tarifler</button>
    <button id="pauseBtn" aria-label="Duraklat"><svg viewBox="0 0 16 16"><rect x="2" y="1" width="4" height="14" rx="1"/><rect x="10" y="1" width="4" height="14" rx="1"/></svg></button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="recipe" hidden aria-live="polite"></div>
  <div id="daycard" hidden role="status"></div>
  <section id="desk" hidden aria-label="Usta masası">
    <div class="dhead"><b>Usta masası</b><span><i class="coin"></i><em id="deskMoney" style="font-style:normal">0</em></span><button id="deskClose" aria-label="Kapat">×</button></div>
    <nav id="deskTabs">
      <button data-tab="gear" class="on">Ekipman</button><button data-tab="shop">Fırın</button><button data-tab="staff">Çalışan</button><button data-tab="belt">Bantlar</button>
      <button data-tab="farm">Çiftlik</button><button data-tab="sube">Şube</button><button data-tab="guild">Ödül</button>
    </nav>
    <div id="deskList"></div>
  </section>
  <div id="modal" hidden></div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d'), app = $('#app');
// Dünya: üstte fırın (0-760) ve çiftlik (760-1460); fırının altında çarşı yolu, onun altında Çarşı şubesi; çiftliğin güneyi satılık arazi
const GAME_VERSION = 'v14';
const W = 1460, H = 1800, SHOP_W = 760, PI2 = Math.PI * 2;
const CARSI_Y = 1000;   // Çarşı şubesi fırınla aynı düzende, 1000 birim aşağıda
const FARM_S = 892;     // çiftliğin güney çiti; altı "Yeni arazi"

/* ================= Veri ================= */
// Satılan ürünler (ucuzdan pahalıya). İlk beşi köy fırınında, son dördü Çarşı şubesinde satılır.
const PRODUCTS = {
  ekmek: { name:'Ekmek',         val:8,  col:'#c9822b' },
  simit: { name:'Simit',         val:12, col:'#b8743a' },
  pogaca:{ name:'Poğaça',        val:24, col:'#e8b04a' },
  kurabiye:{ name:'Kurabiye',    val:30, col:'#d9a55a' },
  pasta: { name:'Çilekli pasta', val:80, col:'#ff8fb0' },
  borek: { name:'Börek',         val:45, col:'#e0b060' },
  aycoregi:{ name:'Ay çöreği',   val:55, col:'#c98a3a' },
  pide:  { name:'Pide',          val:60, col:'#d9963a' },
  baklava:{ name:'Baklava',      val:140, col:'#d4a017' },
};
const PROD_ORDER = ['ekmek', 'simit', 'pogaca', 'kurabiye', 'pasta', 'borek', 'aycoregi', 'pide', 'baklava'];
const SHOP_PRODS = [['ekmek', 'simit', 'pogaca', 'kurabiye', 'pasta'], ['borek', 'aycoregi', 'pide', 'baklava']];
const shopOf = p => SHOP_PRODS[1].includes(p) ? 1 : 0;
const zeroProducts = () => Object.fromEntries(PROD_ORDER.map(p => [p, 0]));
// Çiftlikten toplanan hammaddeler
const MATS = {
  bugday: { name:'Buğday',  area:null,     base:.55, tool:'orak',  max:5, regen:2.4,   bit:'#e8c25a', col:'#e8c25a', from:'Tarladan biç' },
  su:     { name:'Su',      area:null,     base:.45, tool:'kova',  max:6, regen:1.4, bit:'#8fd0ff', col:'#5aaee8', from:'Kuyudan çek' },
  yumurta:{ name:'Yumurta', area:'coop',   base:.8,  tool:'sepet', max:2, regen:5,   bit:'#f7efe2', col:'#f2e6cf', from:'Kümesteki yuvalardan topla' },
  sut:    { name:'Süt',     area:'barn',   base:1,   tool:'kova',  max:3, regen:6,   bit:'#ffffff', col:'#ffffff', from:'Ahırdaki ineklerden sağ' },
  cilek:  { name:'Çilek',   area:'garden', base:.7,  tool:'sepet', max:3, regen:5,   bit:'#ff5a6a', col:'#e8323f', from:'Çilek bahçesinden topla' },
  susam:  { name:'Susam',   area:'susamF', base:.7,  tool:'orak',  max:4, regen:3.5, bit:'#efe0b0', col:'#e8d9a8', from:'Susam tarlasından biç' },
  seker:  { name:'Şeker pancarı', area:'pancarF', base:.9, tool:'kurek', max:3, regen:5, bit:'#b8324a', col:'#9a2a4a', from:'Pancar tarlasından kürekle sök' },
  bal:    { name:'Bal',     area:'kovan',   base:.9, tool:'sepet', max:2, regen:7,   bit:'#f2b544', col:'#e8a830', from:'Arı kovanlarından sağ' },
  findik: { name:'Fındık',  area:'findikB', base:.7, tool:'sepet', max:4, regen:5,   bit:'#a0703c', col:'#8a5a2a', from:'Fındık ağaçlarından topla' },
  zeytin: { name:'Zeytin',  area:'zeytinB', base:.7, tool:'sepet', max:4, regen:5,   bit:'#6b7a2a', col:'#5a6a2a', from:'Zeytin ağaçlarından topla' },
};
const MAT_ORDER = ['bugday', 'su', 'yumurta', 'sut', 'cilek', 'susam', 'seker', 'bal', 'findik', 'zeytin'];
const INTER = { un:'Un', hamur:'Hamur' };   // ara ürünler: istasyonda yapılır, başka istasyona girer
const ITEM_NAME = t => PRODUCTS[t] ? PRODUCTS[t].name : MATS[t] ? MATS[t].name : INTER[t] || t;
const ITEM_COL  = t => PRODUCTS[t] ? PRODUCTS[t].col : MATS[t] ? MATS[t].col : t === 'hamur' ? '#f3e6c4' : '#e8dcc0';
// İstasyonlar: her birinin hammadde kutuları kendi önünde, çıkan ürün önündeki tepside. shop 0: köy fırını, 1: Çarşı şubesi
const STATIONS = [
  { id:'M', shop:0, kind:'mill', x:75,  y:170, out:'un',     recipe:{ bugday:1 },                         time:1.3, req:null, name:'Değirmen' },
  { id:'E', shop:0, kind:'oven', x:195, y:170, out:'ekmek',  recipe:{ un:2, su:1 },                       time:3,   req:null, name:'Ekmek fırını', trim:'#c9822b' },
  { id:'S', shop:0, kind:'oven', x:315, y:170, out:'simit',  recipe:{ un:1, su:1, susam:1 },              time:2.6, req:'S5', name:'Simit fırını', trim:'#b8743a' },
  { id:'P', shop:0, kind:'oven', x:435, y:170, out:'pogaca', recipe:{ un:1, yumurta:1, sut:1 },           time:4,   req:'S3', name:'Poğaça fırını', trim:'#e8b04a' },
  { id:'K', shop:0, kind:'oven', x:555, y:170, out:'kurabiye', recipe:{ un:1, yumurta:1, seker:2 },       time:3.6, req:'S6', name:'Kurabiye fırını', trim:'#d9a55a' },
  { id:'T', shop:0, kind:'oven', x:675, y:170, out:'pasta',  recipe:{ un:2, yumurta:2, sut:1, cilek:2 },  time:6,   req:'S4', name:'Pasta fırını', trim:'#ff8fb0' },
  { id:'M2', shop:1, kind:'mill', x:75,  y:1170, out:'un',    recipe:{ bugday:1 },                       time:1.3, req:'carsi', name:'Taş değirmen' },
  { id:'H',  shop:1, kind:'prep', x:195, y:1170, out:'hamur', recipe:{ un:2, su:1 },                     time:1.8, req:'carsi', name:'Hamur tezgahı' },

function collide(e, r) {
  for (const b of boxes()) {
    const cx = Math.max(b.x, Math.min(e.x, b.x + b.w)), cy = Math.max(b.y, Math.min(e.y, b.y + b.h));
    const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < r * r) {
      if (d2 > 1e-6) { const d = Math.sqrt(d2); e.x += dx / d * (r - d); e.y += dy / d * (r - d); }
      else {
        const l = e.x - b.x, rr = b.x + b.w - e.x, t = e.y - b.y, bb = b.y + b.h - e.y, m = Math.min(l, rr, t, bb);

  e.x = Math.max(44, Math.min(W - 30, e.x)); e.y = Math.max(122, Math.min(H - 52, e.y));

const regionOf = (x, y) => x >= SHOP_EDGE ? 'farm' : y < 445 ? 'top' : y < 880 ? 'low' : y < CARSI_Y + 50 ? 'street' : 'carsi';
const PORTALS = {
  'top>farm':[[LANE_X, DOOR.y], [DOOR.outX, DOOR.y]], 'farm>top':[[DOOR.outX, DOOR.y], [LANE_X, DOOR.y]],

  'low>street':[[300, 862], [300, STREET_Y]],          'street>low':[[300, STREET_Y], [300, 862]],
  'street>carsi':[[700, STREET_Y], [700, CARSI_Y + 120]], 'carsi>street':[[700, CARSI_Y + 120], [700, STREET_Y]],
};
const NEXT_REGION = {
  top:{ farm:'farm', low:'low', street:'low', carsi:'low' }, low:{ top:'top', farm:'top', street:'street', carsi:'street' },
  street:{ low:'low', top:'low', farm:'low', carsi:'carsi' }, carsi:{ street:'street', low:'street', top:'street', farm:'street' },
  farm:{ top:'top', low:'top', street:'top', carsi:'top' },
};
const atPt = (n, p) => Math.abs(n.x - p[0]) < .5 && Math.abs(n.y - p[1]) < .5;
function navStep(n, tx, ty) {
  if (n.via) { if (atPt(n, n.via)) n.via = null; else return n.via; }   // kapıdan geçerken giriş noktasına varana dek
  const a = regionOf(n.x, n.y), b = regionOf(tx, ty);
  if (a === b) return [tx, ty];
  const [ex, en] = PORTALS[a + '>' + NEXT_REGION[a][b]];
  if (atPt(n, ex)) { n.via = en; return en; }
  return ex;
}
function walk(n, tx, ty, spd, dt) {
  const [wx, wy] = navStep(n, tx, ty);
  const dx = wx - n.x, dy = wy - n.y, d = Math.hypot(dx, dy), st = spd * dt;
  if (d > st) { n.x += dx / d * st; n.y += dy / d * st; n.fx = dx / d; n.fy = dy / d; }
  else { n.x = wx; n.y = wy; }
  n.moving = !(n.x === tx && n.y === ty);
  if (n.moving) n.phase += dt * 13;
}

function gather(e, carry, capN, dt, timeFn, onlyMat) {
  let best = null, bd = 34 * 34;
  for (const nd of NODES) {
    if (!nodeOpen(nd) || nd.amt <= 0 || (onlyMat && nd.m !== onlyMat)) continue;
    const d = dist2(e, nd.x, nd.y); if (d < bd) { bd = d; best = nd; }
  }
  e.gNode = null;
  if (!best || carry.length >= capN) { e.gT = 0; return false; }
  e.gNode = best; e.gT = (e.gT || 0) + dt;
  const need = timeFn(best.m); e.gProg = e.gT / need;
  e.bitT = (e.bitT || 0) + dt;
  if (e.bitT > .22) { e.bitT = 0; chips(best.x, best.y, MATS[best.m].bit, 2); if (e === P) sfx('chop'); }
  if (e.gT >= need) {
    e.gT = 0; best.amt--; carry.push(best.m); chips(best.x, best.y, MATS[best.m].bit, 5);
    if (best.m === 'sut' && Math.random() < .25) say(best, pick(BANTER.cow));   // sağılan inek söylenir
    fly('item', best.m, best.x, best.y - 10, cp(e).x, cp(e).y, .22);
    if (e === P) sfx('pick');
  }
  return true;
}

function depositTo(e, carry, s, dt, rate = .07, accept = () => true) {
  let i = carry.length - 1; while (i >= 0 && !(binRoom(s, carry[i]) && accept(carry[i]))) i--;
  if (i < 0) { e.depT = 0; return false; }
  e.depT = (e.depT || 0) + dt;
  if (e.depT >= rate) {
    e.depT = 0; const t = carry.splice(i, 1)[0]; G.st[s.id].bins[t]++;
    const k = Object.keys(s.recipe).indexOf(t);
    fly('item', t, cp(e).x, cp(e).y, binPos(s, k).x, binPos(s, k).y - 6, .22);
    if (e === P) sfx('drop');
  }
  return true;
}

// Günün vaktine göre ürün seçimi (sabah ekmek, akşam pasta…), etkinlik çarpanlarıyla
function pickWanted(shop = 0) {
  const ps = shopProducts(shop); if (!ps.length) return null;
  const ph = phaseOf(), weights = PHASES[ph].w || PHASES.ogle.w, ev = eventOf();
  const wt = p => (G.counter[p] > 0 ? 2 : G.st[OVENS.find(s => s.out === p).id].out > 0 ? 1 : .3) * (weights[p] || 1) * (ev && ev.mul[p] && (!ev.aksam || ph === 'aksam') ? ev.mul[p] : 1);

}
const MAX_N = { ekmek:4, simit:4, pogaca:3, kurabiye:3, pasta:2, borek:3, aycoregi:3, pide:2, baklava:2 };
const QUEUE = [{ x:300, y0:548, max:5 }, { x:300, y0:CARSI_Y + 548, max:4 }];

// Yürüyen müşteri: önce yol noktaları (kapı), sonra hedef. Varınca true döner.
function stepWalker(c, spd, dt) {

  const dx = gx - c.x, dy = gy - c.y, d = Math.hypot(dx, dy), st = spd * dt;

  for (const r of riders) if (r.dst === 'counter') d[r.item]--;

// Her dükkanın satış durumu: kuyruğun başındaki müşteri, satış sayacı, kasa çekmecesi animasyonu
const SV = [{ t:0, int:.2, front:null, regAnim:0 }, { t:0, int:.2, front:null, regAnim:0 }];
let spawnT2 = 4;
function arrivalInterval(sh, eventMul = 1) {

function updateCustomers(dt) {

// Kuyruğun başındaki müşteriye satış: kasiyer (ya da müdür) tezgahtaysa veya sen yeşil alandaysan
function serveShop(sh, dt) {

  if ((updateDay.t = (updateDay.t || 0) + dt) >= 10) { const r = (G.ern - (updateDay.e ?? G.ern)) / updateDay.t; updateDay.e = G.ern; updateDay.t = 0; G.rate = G.rate ? G.rate * .9 + r * .1 : r; }

/* ================= Özel sipariş ================= */

// Garson: önce bekleyen misafire vitrinden ürün götürür, sonra kirli masaları siler.

// Her biten iş 1 tecrübe; seviye = 1 + √(tecrübe/6), en çok 5. Her seviye %7 hız.
const lvlOf = k => Math.min(5, 1 + Math.floor(Math.sqrt((G.xp[k] || 0) / 6)));
const xpMul = k => 1 + .07 * (lvlOf(k) - 1);
const carSpd = n => carSpeed() * xpMul(n.k);
const gatSpd = n => gatSpeed() * xpMul(n.k);
function addXp(k, name) {
  if (!(k in G.xp)) return;
  const before = lvlOf(k); G.xp[k]++;
  if (lvlOf(k) > before) { toast(`${name} ${lvlOf(k)}. seviyeye çıktı, artık daha hızlı!`); sfx('unlock'); }
}

/* ================= Çırak: talebe göre iş seçer ================= */
// İşler (puanı yüksek olan önce):
//  1) Müşterinin beklediği ürünü fırının tepsisinden vitrine taşı
//  2) Ambardaki hammaddeyi / değirmendeki unu, talebi olan (ya da kutusu boşalan) istasyona götür
//  3) Tepside kalan ürünleri vitrine yerleştir
const DEPOT_SRC = 'AMBAR';
const depotPoint = n => ({ x:DEPOT.x + 36 + (n.off || 0) * .8, y:DEPOT.y + 60 + carriers.indexOf(n) * 30 });
function claimed(srcId, item, me) { return carriers.some(n => n !== me && n.task && n.task.src === srcId && n.task.item === item && n.state === 'fetch'); }
function claimedAmount(srcId, item, me) { let k = 0; for (const n of carriers) if (n !== me && n.task && n.task.src === srcId && n.task.item === item && n.state === 'fetch') k += n.task.amount; return k; }
function chooseCarrierTask(n) {
  let best = null;
  const consider = t => {
    if ((G.workerPri === 'supply' && ST[t.dst]) || G.workerPri === t.dst) t.score += 450;
    if (t.amount > 0 && (!best || t.score > best.score)) best = t;
  };
  const sh = n.shop || 0, hasSeller = G.unlocked[CSS[sh].unlock];
  for (const s of OVENS) {
    if (!active(s) || s.shop !== sh) continue;
    const p = s.out, have = G.st[s.id].out, room = crateCap() - G.counter[p] - beltIncomingCounter(p);
    // fazla ürün: vitrin dolu ve tepside birikmişse tezgaha (köy fırınında)
    if (sh === 0 && G.unlocked.stand && have > 0 && (room <= 0 || (G.counter[p] >= Math.min(2, crateCap()) && standTotal() + standIncoming() < standTarget())) && !claimed(s.id, p, n)) {
      const sr = standCap() - standTotal() - standIncoming();
      if (sr > 0) consider({ score:(standTotal() < standTarget() ? 1150 : 60) + have * 3, src:s.id, item:p, dst:'stand', amount:Math.min(carCap(n), have, sr) });
    }
    // ürünü vitrine taşımak kasiyerin (şubede müdürün) işi; çırak yalnızca o yokken yardım eder
    if (hasSeller && DEM[p] <= 0 && G.counter[p] >= 2) continue;
    if (have > 0 && room > 0 && DEM[p] > 0 && !claimed(s.id, p, n)) consider({ score:1000 + DEM[p] * 50, src:s.id, item:p, dst:'counter', amount:Math.min(carCap(n), room) });
    if (have > 0 && room > 0 && !claimed(s.id, p, n)) consider({ score:100 + have * 5, src:s.id, item:p, dst:'counter', amount:Math.min(carCap(n), room) });
  }
  // ara ürün (un, hamur): üretildiği istasyondan aynı binada onu kullanan istasyona
  for (const pr of STATIONS) {
    if (!active(pr) || pr.shop !== sh || !INTER[pr.out]) continue;
    const item = pr.out, avail = G.st[pr.id].out - claimedAmount(pr.id, item, n);
    if (avail <= 0) continue;
    for (const s of STATIONS) {
      if (!active(s) || s.shop !== sh || !s.recipe[item]) continue;
      const deficit = binCap() - G.st[s.id].bins[item] - incoming(s.id, item);
      if (deficit <= 0) continue;
      // tüketen istasyon aç kalmışsa (kutusunda bir pişirimlik bile yok) en öne: zincirin geri kalanı ona bağlı
      const starving = G.st[s.id].bins[item] < s.recipe[item], downstream = INTER[s.out] || DEM[s.out] > 0;
      const w = (DEM[s.out] > 0 ? 3 : 1) * (G.st[s.id].bins[item] < s.recipe[item] * 2 ? 2 : 1);
      consider({ score:(starving && downstream ? 1500 : 400 + w * 60) + deficit, src:pr.id, item, dst:s.id, amount:Math.min(carCap(n), deficit, avail) });
    }
  }
  // hammadde: ambar → istasyon
  for (const s of STATIONS) {
    if (!active(s) || s.shop !== sh) continue;
    for (const m of Object.keys(s.recipe)) {
      if (!MATS[m]) continue;
      const avail = G.depot[m] - claimedAmount(DEPOT_SRC, m, n), deficit = binCap() - G.st[s.id].bins[m] - incoming(s.id, m);
      if (avail <= 0 || deficit <= 0) continue;
      const w = matPriority(m) * (s.kind === 'oven' && DEM[s.out] > 0 ? 1.5 : 1);
      consider({ score:380 + w * 50 + deficit, src:DEPOT_SRC, item:m, dst:s.id, amount:Math.min(carCap(n), deficit, avail) });
    }
  }
  return best;
}
function updateCarrier(n, dt) {
  if (n.state === 'idle') {
    n.task = chooseCarrierTask(n);
    if (n.task) n.state = 'fetch';
    else { walk(n, n.home.x, n.home.y, carSpd(n), dt); n.status = n.moving ? '' : 'İş bekliyor'; return; }
  }
  const t = n.task, fromDepot = t.src === DEPOT_SRC, src = fromDepot ? null : ST[t.src];
  const srcPt = fromDepot ? depotPoint(n) : { x:zoneOf(src).x + n.off, y:zoneOf(src).y };
  if (n.state === 'fetch') {
    walk(n, srcPt.x, srcPt.y, carSpd(n), dt);
    n.status = '';
    if (!n.moving) {
      const got = n.carry.filter(x => x === t.item).length;
      let busy;
      if (fromDepot) {
        busy = got < t.amount && G.depot[t.item] > 0 && n.carry.length < carCap(n);
        if (busy && (n.actT = (n.actT || 0) + dt * .6) >= .085) { n.actT = 0; G.depot[t.item]--; n.carry.push(t.item); fly('item', t.item, BIN_COL_X, depotBinY(t.item) - 6, cp(n).x, cp(n).y, .22); }
      } else busy = pickFrom(n, n.carry, src, carCap(n), dt * .6, .085, t.amount - got);
      if (!busy) { if (n.carry.length) n.state = 'deliver'; else { n.state = 'idle'; n.task = null; } }
    }
  } else if (n.state === 'deliver') {
    if (!n.carry.length) { addXp(n.k, 'Çırak'); n.state = 'idle'; n.task = null; return; }
    let ok;
    if (t.dst === 'counter') { const D = DROPS[n.shop || 0]; walk(n, D.x + D.w / 2 + n.off, D.y + 24, carSpd(n), dt); ok = n.moving || dropCounter(n, n.carry, dt * .6); }
    else if (t.dst === 'stand') { walk(n, STAND_DROP.x + STAND_DROP.w / 2 + n.off, STAND_DROP.y + 20, carSpd(n), dt); ok = n.moving || dropStand(n, n.carry, dt * .6); }
    else { const s = ST[t.dst], z = zoneOf(s); walk(n, z.x + n.off, z.y, carSpd(n), dt); ok = n.moving || depositTo(n, n.carry, s, dt * .6, .07, x => x === t.item); }
    if (!ok) { n.stuckT = (n.stuckT || 0) + dt; n.status = 'Yer yok'; if (n.stuckT > 1.5) { n.stuckT = 0; n.state = 'return'; } }
    else n.stuckT = 0;
  } else if (n.state === 'return') {   // sığmayanı geldiği yere (tepsi ya da ambar) geri koy
    walk(n, srcPt.x, srcPt.y, carSpd(n), dt);
    n.status = 'Geri bırakıyor';
    if (!n.moving) {
      n.actT = (n.actT || 0) + dt;
      if (n.actT >= .1) {
        n.actT = 0; const t2 = n.carry.pop();
        if (t2 !== undefined) {
          if (fromDepot) { G.depot[t2]++; fly('item', t2, n.x, n.y - 20, BIN_COL_X, depotBinY(t2) - 6, .2); }
          else { G.st[src.id].out++; fly('item', t2, n.x, n.y - 20, srcPt.x, srcPt.y - 4, .2); }
        }
      }
      if (!n.carry.length) { n.state = 'idle'; n.task = null; }
    }
  }
}

/* ================= Toplayıcı: talebe göre hammadde toplar, ambara getirir ================= */
// Puan: istasyonlarda eksik olan (talep ve boş kutu ağırlıklı) − ambarda zaten olan. Acil iş yoksa ambarı doldurur (boş beklemez).
function matScores() {
  const sc = {};
  for (const m of MAT_ORDER) {
    if (!NODES.some(nd => nd.m === m && nodeOpen(nd) && nd.amt > 0) || !matOpen(m) || !STATIONS.some(s => active(s) && s.recipe[m] !== undefined) || !depotRoom(m)) continue;
    const inTransit = gatherers.reduce((a,n) => a + n.carry.filter(t => t === m).length, 0);
    const urgent = Math.max(0, needFor(m) - G.depot[m] - inTransit) * matPriority(m);
    sc[m] = urgent * 10 + (depotCap() - G.depot[m]);
  }
  return sc;
}
function updateGatherer(n, dt) {
  n.gNode = null;
  if (n.state === 'gather') {
    if (!n.carry.length) {
      const score = matScores();
      const others = gatherers.filter(o => o !== n).map(o => o.mat);
      n.mat = Object.keys(score).sort((a, b) => score[b] * (others.includes(b) ? .4 : 1) - score[a] * (others.includes(a) ? .4 : 1))[0] || null;
      const otherCarry = gatherers.filter(o => o !== n).reduce((a, o) => a + o.carry.filter(x => x === n.mat).length, 0);
      n.goal = n.mat ? Math.max(1, Math.min(gatCap(), depotCap() - G.depot[n.mat] - otherCarry)) : 0;
    }
    const nodes = n.mat ? NODES.filter(nd => nd.m === n.mat && nd.amt > 0 && nodeOpen(nd)) : [];
    if (n.carry.length && (n.carry.length >= n.goal || !nodes.length)) n.state = 'deliver';
    else if (nodes.length) {
      const nd = nodes.sort((a, b) => dist2(n, a.x, a.y) - dist2(n, b.x, b.y))[0];
      walk(n, nd.x - 22, nd.y + 6, gatSpd(n), dt); n.status = '';
      if (!n.moving) { n.fx = 1; n.fy = 0; gather(n, n.carry, n.goal, dt, gatTime, n.mat); }
    } else {
      walk(n, n.home.x, n.home.y, gatSpd(n), dt);
      n.status = n.mat ? `${MATS[n.mat].name} bekliyor` : 'Ambar dolu';
    }
  }
  if (n.state === 'deliver') {
    if (!n.carry.length) { addXp(n.k, 'Toplayıcı'); n.state = 'gather'; return; }
    const i = gatherers.indexOf(n);
    walk(n, DEPOT.x + 30, DEPOT.y + 130 + i * 30, gatSpd(n), dt);
    n.status = '';
    if (!n.moving) {
      const k = n.carry.findIndex(depotRoom);
      if (k < 0) { n.status = 'Ambar dolu'; return; }
      if ((n.depT = (n.depT || 0) + dt * .6) >= .07) {
        n.depT = 0; const m = n.carry.splice(k, 1)[0]; G.depot[m]++;
        fly('item', m, cp(n).x, cp(n).y, BIN_COL_X, depotBinY(m) - 6, .22);
      }
    }
  }
}

/* ================= Kasiyer (köy fırını) ve şube müdürü (Çarşı şubesi) ================= */
// Görevleri: fırından ürünü alıp vitrine koymak ve müşteriye satmak.
//  counter → tezgahta: satış yapar; sıradaki müşterinin istediği vitrinde yoksa fırına gider; müşteri yoksa vitrini tamamlar
//  fetch   → fırının tepsisinden ürünü tepsisine alır
//  back    → vitrine döner, ürünü bölmesine koyar (köy fırınında özel sipariş sepetine de)
// Kasiyer fırına gittiğinde satış durur (yeşil alandaysan satışı sen yaparsın).
const mkCashier = (shop, unlock, xp, look) => ({ shop, unlock, xp, look, isCashier:true, home:CASHIERS[shop], x:CASHIERS[shop].x, y:CASHIERS[shop].y, tx:CASHIERS[shop].x,
  fx:0, fy:1, phase:0, moving:false, wait:1, turn:1, state:'counter', carry:[], task:null, busy:false, anim:0, item:'ekmek' });
const CS = mkCashier(0, 'cash', 'cash', { dress:'#8a3f3f', skin:SKIN[0], hair:HAIR[2] });

const CSS = [CS, CS2];
const CASH_CAP = 4;
const cashSpeed = () => 80 * (1 + .12 * G.lv.cashSpd);
function cashierTask(cs) {
  const FRONT = SV[cs.shop].front, ovens = cs.shop ? OVENS1 : OVENS0;
  // 1) sıradaki müşterinin istediği vitrinde yok ve yolda gelmiyorsa: fırından al
  if (FRONT && G.counter[FRONT.want] <= 0 && beltIncomingCounter(FRONT.want) === 0) {
    const s = ovens.find(o => active(o) && o.out === FRONT.want && G.st[o.id].out > 0);
    if (s) return { s, amount:Math.max(1, Math.min(CASH_CAP, FRONT.n - FRONT.got + 1, crateCap() - G.counter[s.out])) };
  }
  // 2) özel sipariş varsa (köy fırını): eksik ürünü fırından alıp sipariş sepetine koy
  if (cs.shop === 0 && ORDER && (!FRONT || G.counter[FRONT.want] > 0)) {
    for (const p of Object.keys(ORDER.items)) {
      const left = orderLeft(ORDER, p); if (left <= 0) continue;
      const s = ovens.find(o => active(o) && o.out === p && G.st[o.id].out > 0);
      if (s) return { s, amount:Math.min(CASH_CAP, left, G.st[s.id].out), dst:'order' };
    }
  }
  // 3) müşteri beklemiyorsa: vitrinde azalan ürünü (önce talep) fırından tamamla
  if (!FRONT || G.counter[FRONT.want] > 0) {
    let best = null, bs = 0;
    for (const o of ovens) {
      if (!active(o) || G.st[o.id].out <= 0) continue;
      const room = crateCap() - G.counter[o.out] - beltIncomingCounter(o.out);
      if (room <= 0 || G.counter[o.out] >= 3 && DEM[o.out] <= 0) continue;
      const sc = (DEM[o.out] > 0 ? 100 + DEM[o.out] : 0) + (3 - Math.min(3, G.counter[o.out])) * 10 + G.st[o.id].out;
      if (sc > bs) { bs = sc; best = { s:o, amount:Math.min(CASH_CAP, room, G.st[o.id].out) }; }

}
function updateCashier(cs, dt) {
  if (!G.unlocked[cs.unlock]) return;
  cs.anim = Math.max(0, cs.anim - dt * 3);
  const spd = cashSpeed() * xpMul(cs.xp), home = cs.home;
  let tx = cs.tx, ty = home.y;
  if (cs.state === 'counter') {
    if (!cs.busy && cs.anim === 0) {
      const t = cashierTask(cs);
      if (t) { cs.task = t; cs.state = 'fetch'; }
    }
    if (cs.state === 'counter') {
      if (cs.busy || cs.anim > 0) tx = 168;
      else if ((cs.wait -= dt) <= 0) { cs.tx = tx = 108 + Math.random() * 80; cs.wait = 1.6 + Math.random() * 2.6; cs.turn = Math.random() < .5 ? -1 : 1; }
      cs.tx = tx;
    }
  }
  if (cs.state === 'fetch') {
    const s = cs.task.s, z = zoneOf(s); tx = z.x - 12; ty = z.y;
    if (cs.x === tx && cs.y === ty) {
      const busy = pickFrom(cs, cs.carry, s, CASH_CAP, dt, .12, cs.task.amount - cs.carry.length);
      if (!busy) cs.state = 'back';
    }
  }
  if (cs.state === 'back') {
    const toOrder = cs.task && cs.task.dst === 'order';
    if (toOrder) { tx = BASKET.x - 24; ty = BASKET.y; } else { tx = 240; ty = home.y; }   // sipariş sepeti ya da yeşil alanın sol ucu (vitrin)
    if (cs.x === tx && cs.y === ty) {
      const busy = cs.carry.length && (toOrder ? deliverToOrder(cs, cs.carry, dt, .1) : dropCounter(cs, cs.carry, dt, .1));
      if (!cs.carry.length || !busy) {
        // vitrinde yer yoksa kalanı fırına geri bırakır
        for (const t of cs.carry.splice(0)) { const o = OVENS.find(x => x.out === t); G.st[o.id].out++; }
        addXp(cs.xp, cs.shop ? 'Şube müdürü' : 'Kasiyer'); cs.state = 'counter'; cs.task = null; cs.tx = 168;
      }
    }
  }
  // yürüme
  const dx = tx - cs.x, dy = ty - cs.y, d = Math.hypot(dx, dy), st = spd * dt;
  cs.moving = d > st;
  if (cs.moving) { cs.x += dx / d * st; cs.y += dy / d * st; cs.fx = dx / d; cs.fy = dy / d; cs.phase += dt * 12; }
  else {
    cs.x = tx; cs.y = ty;
    if (cs.state !== 'counter') { cs.fx = 0; cs.fy = cs.state === 'fetch' ? -1 : 1; }
    else if (cs.busy || cs.anim > 0) { cs.fx = .3; cs.fy = 1; }
    else { cs.fx = Math.sin(time * .9) * .5 * cs.turn; cs.fy = 1; }
  }
}


/* ================= Traktör / biçerdöver ================= */
// Başaklı en yakın tarla noktasına gider, biçer; kasası dolunca (ya da tarlada başak kalmayınca) çiftlik kapısında ambara boşaltır.
// Biçerdöver iki kat hızlı ve geniştir: bir noktayı biçerken yanındakilerden de alır. Ambar doluysa bekler.
const TR = { x:795, y:790, home:{ x:795, y:790 }, fx:1, fy:0, state:'park', carry:0, node:null, t:0, moving:false, status:'' };
function goStraight(e, tx, ty, spd, dt) {

  e.x = tx; e.y = ty; e.moving = false; return true;
}
function updateTractor(dt) {
  if (!G.unlocked.traktor) return;
  const big = !!G.unlocked.bicer, spd = (110 + 18 * G.lv.trSpd) * (big ? 1.25 : 1), hT = (big ? .14 : .28) / usta();
  const room = depotCap() - G.depot.bugday - ridingTo('depot', 'bugday') - TR.carry;
  TR.status = '';

    if (goStraight(TR, 790, 455, spd, dt)) {
      TR.fx = -1; TR.fy = 0;
      if ((TR.t += dt) >= .08) {
        TR.t = 0;
        if (TR.carry > 0 && G.depot.bugday < depotCap()) { TR.carry--; G.depot.bugday++; fly('item', 'bugday', TR.x - 12, TR.y - 30, BIN_COL_X, depotBinY('bugday') - 6, .3); }
        else if (TR.carry > 0) TR.status = 'Ambar dolu';

      if (TR.carry === 0) TR.state = 'park';
    }

  }
  if (TR.carry >= trCap() || (TR.carry > 0 && room <= 0)) { TR.state = 'unload'; return; }
  let nd = TR.node;
  if (!nd || nd.amt <= 0 || !nodeOpen(nd)) {
    nd = NODES.filter(n => n.m === 'bugday' && n.amt > 0 && nodeOpen(n)).sort((a, b) => dist2(TR, a.x, a.y) - dist2(TR, b.x, b.y))[0] || null;
    TR.node = nd;
  }
  if (!nd || room <= 0) {
    if (TR.carry > 0) { TR.state = 'unload'; return; }
    TR.state = 'park'; goStraight(TR, TR.home.x, TR.home.y, spd, dt);
    TR.status = room <= 0 ? 'Ambar dolu' : 'Başak bekliyor'; return;
  }
  TR.state = 'harvest';
  if (goStraight(TR, nd.x - 6, nd.y + 16, spd, dt)) {
    TR.fx = 1; TR.fy = 0;
    if ((TR.t += dt) >= hT) {
      TR.t = 0; nd.amt--; TR.carry++; chips(nd.x, nd.y, '#e8c25a', 4);
      if (big && TR.carry < trCap()) {   // biçerdöverin geniş tablası: yandaki noktadan da biçer
        const nb = NODES.find(n => n !== nd && n.m === 'bugday' && n.amt > 0 && nodeOpen(n) && dist2(nd, n.x, n.y) < 95 * 95);
        if (nb) { nb.amt--; TR.carry++; chips(nb.x, nb.y, '#e8c25a', 3); }
      }
    }
  }
}

// Tezgahta ürün varsa sokaktan geçenler girer, 1-3 ürün alıp parasını kutuya bırakır (doğrudan kesene).
let buyers = [], buyT = 6;
const SELF_LINES = ['Kendim alırım, sağ olun', 'Parayı kutuya bıraktım usta', 'Self servis, modern iş', 'Bunlar sıcak mı abi?', 'Kuyruk beklemem ben'];
function updateStandBuyers(dt) {

      buyT = 10 + Math.random() * 6;

      buyers.push(Object.assign({ x:e.x, y:e.y, path:e.path.slice(), tx:STAND.x + 20 + Math.random() * 80, ty:STAND_DROP.y + 8, state:'in', fx:0, fy:-1, phase:0, moving:true, t:0, n:0, got:0, paid:0 }, looks()));

        const x = EXIT(0); b.state = 'leave'; b.tx = x.tx; b.ty = x.ty; b.path = x.path;
      } else {

}

/* ================= Kamyonet ve uzak şubeler ================= */
// Kamyonet çarşı yolunda bekler. Tezgahta yeterince ürün birikince yükler, yola çıkar, ürünleri şubelere bırakır,
// dönüşte şubelerin kasasını getirir. Şubeler (müdürleri) stoklarını kendi kendine, köydekinden pahalıya satar.
const VAN = { x:450, y:STREET_Y + 4, home:450, state:'park', t:0, wait:0, dir:-1, till:0, status:'' };

function deliverVanLoad() {
  const brs = branchesOn(); if (!brs.length || !G.vanLoad.length) return;

}
function updateVan(dt) {

      if (avail.length && G.vanLoad.length < vanCap()) {
        const p = avail[0]; G.stand[p]--; G.vanLoad.push(p);
        const sp = standSpot(standTotal()); fly('item', p, sp.x, sp.y, VAN.x + 10, VAN.y - 24, .3);
      } else { VAN.state = 'go'; sfx('ding'); }
    }
  } else if (VAN.state === 'go') {
    VAN.dir = -1; VAN.x -= 230 * dt;
    if (VAN.x < -160) { VAN.state = 'away'; VAN.t = 0; deliverVanLoad(); }
  } else if (VAN.state === 'away') {
    if ((VAN.t += dt) >= 12) {
      VAN.state = 'back'; VAN.till = 0;
      for (const b of brs) { VAN.till += G.br[b.k].till; G.br[b.k].till = 0; }

  } else if (VAN.state === 'back') {

      VAN.x = VAN.home; VAN.state = 'park'; VAN.wait = 0; G.stats.trips++;
      if (VAN.till >= 1) { G.money += VAN.till; floatTxt('Şubelerden +' + fmt(VAN.till), VAN.x, VAN.y - 70, '#8ccf4a'); sfx('unlock'); toast(`Kamyonet döndü: şubelerden ${fmt(VAN.till)} altın`); }

function updateBranches(dt) {
  for (const B of branchesOn()) {

    while (b.acc >= 1) {

      if (!avail.length) { b.acc = 0; break; }
      const p = pick(avail), v = PRODUCTS[p].val * B.mul * usta();

const branchStock = b => PROD_ORDER.reduce((a, p) => a + b.stock[p], 0);

// Oyun kapalıyken: kasiyer varsa son oynanıştaki ortalama kazancın dörtte biri kadar (en çok 4 saat), uzak şubeler de stoklarını satar.
function offlineGain() {
  if (!G.lastSeen) return;
  const sec = Math.min((Date.now() - G.lastSeen) / 1000, 4 * 3600);
  if (sec < 90) return;

  let brGold = 0;
  for (const B of branchesOn()) {
    const b = G.br[B.k], n = Math.min(branchStock(b), Math.floor(sec * branchRate()));
    for (let i = 0; i < n; i++) { const avail = PROD_ORDER.filter(p => b.stock[p] > 0), p = pick(avail), v = PRODUCTS[p].val * B.mul * usta(); b.stock[p]--; b.till += v; b.sold++; brGold += v; }
  }
  if (gold <= 0 && brGold <= 0) return;
  G.money += gold;
  const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60), dur = h ? `${h} saat ${m} dakika` : `${m} dakika`;
  modal(`<h2>Sen yokken</h2><p>${dur} boyunca çalışanların fırını işletti.</p>${gold ? `<p>Kesene eklendi: <b style="color:var(--gold)">${fmt(gold)} altın</b></p>` : ''}${brGold ? `<p>Uzak şubeler ${fmt(brGold)} altınlık satış yaptı; kamyonet bir sonraki seferde kasayı getirir.</p>` : ''}`,
    [['Harika', 'pri', closeModal]]);
}

const rndIn = (a, b) => a + Math.random() * (b - a);

  ...[[1160,250],[1210,350],[1290,280],[1140,340],[1270,370]].map(([x, y], i) => ({ k:'hen', x, y, t:Math.random(), dir:Math.random() * PI2, peck:0, white:i % 2, box:{ x:1110, y:200, w:240, h:200 } })),
  { k:'hog', x:1080, y:780, dir:1, t:2, curl:0 },

function nearPeople(a, r) { return [P, ...gatherers].some(e => dist2(e, a.x, a.y) < r * r); }
const WILD = { x0:SHOP_W + 40, x1:W - 50, y0:150, y1:850 };
function updateCritters(dt) {

    if (a.k === 'bird') {

        if (a.hop > 0) { a.hop -= dt; a.x += a.fx * 40 * dt; a.z = Math.sin(Math.max(0, a.hop) / .25 * Math.PI) * 5; } else a.z = 0;

      if (a.y < b.y || a.y > b.y + b.h) { a.y = Math.max(b.y, Math.min(b.y + b.h, a.y)); a.dir = -a.dir; }

      if (a.y < WILD.y0 || a.y > WILD.y1) { a.y = Math.max(WILD.y0, Math.min(WILD.y1, a.y)); if (a.dir !== undefined) a.dir = -a.dir; }

// Bütün ilerleme tek satırlık bir koda çevrilir: KF2- (sıkıştırılmış) ya da KF1- (sıkıştırma desteklenmiyorsa düz).
// Kod sunucuya gitmez; oyuncu kopyalayıp kendisi saklar, istediği cihazda yapıştırarak geri yükler.
const toB64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pipeBytes(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function makeSaveCode() {
  save();
  const raw = new TextEncoder().encode(JSON.stringify(G));
  try { if (window.CompressionStream) return 'KF2-' + toB64(await pipeBytes(raw, new CompressionStream('deflate-raw'))); } catch (e) {}
  return 'KF1-' + toB64(raw);
}
async function readSaveCode(code) {
  code = code.replace(/\s+/g, '');
  const kind = code.slice(0, 4), body = fromB64(code.slice(4));
  const raw = kind === 'KF2-' ? await pipeBytes(body, new DecompressionStream('deflate-raw')) : kind === 'KF1-' ? body : null;
  if (!raw) throw new Error('kod');
  return normalize(JSON.parse(new TextDecoder().decode(raw)));
}

      ['Evet, sıfırla', 'danger', () => { const s = G.sound; G = fresh(); G.sound = s; G.intro = true; customers = []; carriers = []; gatherers = []; guests = []; parts = []; ORDER = null; for (const t of tableState) Object.assign(t, { guest:null, dirty:false, cleanT:0 }); Object.assign(GAR, { x:590, y:545, carry:[], task:null, state:'idle' }); P.x = G.px; P.y = G.py; save(); closeModal(); toast('Yeni bir fırın, yeni bir başlangıç!'); }]
    ])],
  ]);
}
// Kontroller HUD genişliğinden bağımsız; her telefon yönünde erişilebilir.
const tools = document.createElement('nav'); tools.id='mobileTools'; tools.setAttribute('aria-label','Oyun kontrolleri'); app.appendChild(tools);
tools.appendChild($('#bookBtn'));
const statusBtn = document.createElement('button'); statusBtn.id='statusBtn'; statusBtn.textContent='Durum'; statusBtn.onclick=openOperations; tools.appendChild(statusBtn);
for (const [label,delta] of [['−',-.1],['+',.1]]) { const b=document.createElement('button'); b.textContent=label; b.setAttribute('aria-label',delta < 0 ? 'Uzaklaştır' : 'Yakınlaştır'); b.onclick=() => {G.viewScale=Math.max(.6,Math.min(1.3,Math.round((G.viewScale+delta)*10)/10));resize();save();}; tools.appendChild(b); }
tools.appendChild($('#pauseBtn')); $('#pauseBtn').appendChild(document.createTextNode(' Menü'));
$('#pauseBtn').addEventListener('click', openMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden) { paused = true; joy = null; save(); } else { paused = !modalEl.hidden; lastT = performance.now(); } });
addEventListener('pagehide', save);
// Ana ekrandaki uygulama çoğu zaman yeniden yüklenmeden devam eder.
let updateCheckRunning = false, lastUpdateCheck = 0;
async function checkGameUpdate() {
  if (document.hidden || updateCheckRunning || Date.now() - lastUpdateCheck < 30000) return;
  updateCheckRunning = true; lastUpdateCheck = Date.now();
  try {
    const response = await fetch('./index.html', {cache: 'no-store'});
    if (!response.ok) return;
    const version = (await response.text()).match(/const GAME_VERSION = '(v\d+)'/);
    if (!version || Number(version[1].slice(1)) <= Number(GAME_VERSION.slice(1)) || $('#gameUpdate')) return;
    const button = document.createElement('button');
    button.id = 'gameUpdate'; button.textContent = version[1] + ' hazır · Kaydet ve güncelle';
    button.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:10000;max-width:92vw;background:#195c40;color:white;padding:12px 16px;border:2px solid #fff;border-radius:14px;box-shadow:0 3px 18px #0006';
    button.onclick = () => {
      save();
      try { if (localStorage.getItem(KEY) !== JSON.stringify(G)) throw new Error('save'); }
      catch (_) { button.textContent = 'Kayıt yapılamadı; güncelleme bekletildi'; return; }
      location.reload();
    };
    document.body.appendChild(button);
  } catch (_) { /* Çevrimdışıyken kayıtlı oyun devam eder. */ }
  finally { updateCheckRunning = false; }
}
addEventListener('pageshow', checkGameUpdate);
addEventListener('online', checkGameUpdate);
document.addEventListener('visibilitychange', checkGameUpdate);

new ResizeObserver(resize).observe(app);
new ResizeObserver(() => { $('#recipe').style.top = ($('#hud').offsetHeight + 12) + 'px'; }).observe($('#hud'));

/* ================= Döngü ================= */
let lastT = performance.now(), saveT = 0;
// Döngü önce bir sonraki kareyi ister: bir karede hata olsa bile oyun durmaz (hata konsola bir kez yazılır).
let frameErr = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  try {
    if (!paused) { update(dt); if ((saveT += dt) > 4) { saveT = 0; save(); } }
    render(); hud(dt); updateMusic();
  } catch (e) { if (!frameErr) { frameErr = true; console.error('Köy Fırını kare hatası:', e); } }
}
function start(data) {
  G = normalize(data && data.G) || load() || fresh();
  ORDER = G.order;
  P.x = G.px; P.y = G.py; collide(P, 12);
  if (G.unlocked.car) addCarrier(0);
  if (G.unlocked.car2) addCarrier(1);
  if (G.unlocked.gat) addGatherer(0);
  if (G.unlocked.gat2) addGatherer(1);
  if (G.unlocked.car3) addCarrier(2);
  deliverVanLoad();   // sayfa kapanırken yolda kalan yük şubelere teslim edilir
  resize();
  if (!G.intro) modal(`<h2>Köy Fırını</h2><p>Köyün fırıncısısın. Çiftlikten malzeme topla, değirmende un öğüt, fırında pişir, müşterilere sıcak sıcak sat.</p>${HOW}`,
    [['Fırını aç', 'pri', () => { G.intro = true; save(); closeModal(); }]]);
  else offlineGain();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => { G.px = P.x; G.py = P.y; return { G }; }); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

<script>
// Uygulama: internetsiz çalışma ve kaydın kalıcı saklanması
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(reg => { const check = () => { if (!document.hidden) reg.update().catch(() => {}); }; document.addEventListener('visibilitychange', check); addEventListener('online', check); check(); }).catch(() => {}));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
