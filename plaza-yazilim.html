<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#182c37"><meta name="description" content="Plazada kendi yazılım şirketini kur. Projeleri taşı, kodla, test et, ekibini büyüt.">
<title>Plaza Yazılım · Bir masa, büyük fikirler</title>
<style>
:root{color-scheme:dark;--ink:#edf1e9;--muted:#adc2bc;--mint:#b9efc0;--bg:#182c37;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#28414a;border-radius:14px;padding:12px 16px;min-height:44px}button:focus-visible{outline:3px solid #e4bb75;outline-offset:2px}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--mint);color:#16352a;font-weight:750;border:0}button.danger{color:#ffb8ac}canvas{display:block;width:100vw;height:100dvh}header{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}header .brand,header .cash{background:#182c37eb;border:1px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:0 5px 25px #0002}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--mint);font-weight:700}.brand strong{display:block;font-size:17px;font-weight:650;letter-spacing:-.5px}.cash{text-align:right}.cash strong{font-size:20px;color:var(--mint)}.cash small{display:block;color:var(--muted);font-size:10px}#task{position:fixed;top:max(90px,calc(env(safe-area-inset-top) + 78px));left:14px;right:14px;max-width:460px;display:flex;align-items:center;gap:10px;background:#182c37e8;border:1px solid var(--line);border-radius:16px;padding:10px 12px}#task span{flex:1;font-size:12px;line-height:1.5}#task small{display:block;color:var(--muted);font-size:10px}#task button{padding:8px 12px;background:#d5e6dd;color:#243b36;min-height:38px;font-size:12px}nav{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:14px;display:flex;gap:7px}nav button{box-shadow:0 6px 20px #0003;background:#203a45ed;padding:11px 13px}#cargo{position:fixed;bottom:max(77px,calc(env(safe-area-inset-bottom) + 59px));right:16px;color:#e8d8b5;font-size:11px;background:#182c37cc;border-radius:10px;padding:7px 10px;pointer-events:none}#hint{position:fixed;bottom:25px;left:20px;color:#c5d2cc99;font-size:10px;pointer-events:none;max-width:115px}#toast{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);max-width:85vw;width:max-content;background:#142d32e8;border:1px solid #d3e3bf45;border-radius:18px;padding:14px 20px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;font-size:13px;z-index:5}#overlay{position:fixed;inset:0;background:#0c202ad9;display:grid;place-items:center;padding:18px;z-index:10;backdrop-filter:blur(8px);touch-action:auto}#overlay[hidden]{display:none}.panel{width:min(520px,100%);max-height:88dvh;overflow:auto;background:#1d343e;border:1px solid #ffffff25;border-radius:25px;padding:24px;box-shadow:0 25px 100px #0006}.panel h1{font-size:38px;letter-spacing:-2px;line-height:1.04;margin:12px 0 18px}.panel h2{font-size:26px;letter-spacing:-1px;margin:4px 0 12px}.panel p{color:var(--muted);line-height:1.65}.panel .close{float:right;padding:5px 12px}.panel .row{background:#ffffff05;border:1px solid #ffffff12;border-radius:16px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}.row div{flex:1}.row strong{font-size:14px}.row small{display:block;font-size:11px;line-height:1.6;color:var(--muted);margin-top:4px}.row button{flex-shrink:0;font-size:12px;max-width:115px;padding:10px}.stats{display:flex;gap:8px;margin:16px 0}.stats div{flex:1;background:#ffffff07;padding:13px;border-radius:13px;font-size:11px;color:var(--muted)}.stats b{display:block;font-size:21px;color:var(--mint);margin-bottom:5px}.legend{display:flex;gap:6px;flex-wrap:wrap}.legend span{padding:8px 10px;border-radius:10px;background:#ffffff09;color:#d9e1da;font-size:11px}a{color:var(--mint)}@media(max-height:550px){header .brand,header .cash{padding:6px 12px}.brand strong{font-size:14px}#task{top:66px;max-width:320px;padding:5px 9px}nav{bottom:9px}.panel{max-height:92dvh;padding:18px}#cargo{bottom:65px}}
</style>
<style>
header .brand,header .cash{background:linear-gradient(135deg,#203b42f5,#142d38f5);box-shadow:0 5px 20px #0003,inset 0 1px #ffffff14}header .eyebrow{color:#e3bd7b}.brand strong{letter-spacing:-.7px}#energyDock{position:fixed;left:14px;bottom:max(91px,calc(env(safe-area-inset-bottom) + 82px));background:#172f39ed;border:1px solid #c9d9ca30;border-radius:17px;padding:10px 12px;width:148px;box-shadow:0 7px 25px #0003}#energyDock .label{font-size:10px;color:#d8e0cf;display:flex;justify-content:space-between;gap:6px}#energyDock .track{height:6px;background:#ffffff18;border-radius:6px;overflow:hidden;margin:7px 0}#energyFill{height:100%;background:#b7d5a6;transition:width .2s}#breakButton{width:100%;min-height:31px;padding:5px 8px;font-size:11px;background:#ffffff0b}#refreshments{position:fixed;right:14px;bottom:max(112px,calc(env(safe-area-inset-bottom) + 103px));max-width:180px;padding:10px;background:#213b3cf2;border:1px solid #d9c39a55;border-radius:17px;box-shadow:0 10px 30px #0004}#refreshments[hidden]{display:none}#refreshments small{font-size:10px;color:#d4d5bc;display:block;margin-bottom:7px}#refreshments button{display:block;width:100%;margin-top:5px;padding:8px;font-size:11px;background:#d6dfc9;color:#203d36}#energyDock.low .track div{background:#edb16d}@media(max-height:550px){#energyDock{bottom:72px;width:130px;padding:7px 10px}#refreshments{bottom:72px;max-width:160px}#refreshments button{min-height:36px}#task{max-width:280px}}.panel{background:linear-gradient(150deg,#28434a,#152e3a)}.panel h2{color:#f1e7d1}
</style>

<body>
<canvas id="game" aria-label="Yazılım ofisi. WASD veya yön tuşlarıyla yürü; dokunmatik ekranda sürükle. Hedefe git düğmesi otomatik yürütür."></canvas>
<header><div class="brand"><div class="eyebrow">KAT 12 / PLAZA</div><strong>yazılım atölyesi.</strong></div><div class="cash"><strong id="money">₺0</strong><small id="level">Bağımsız geliştirici</small></div></header>
<section id="task" aria-live="polite"><span id="objective"></span><button id="go">Git →</button></section>
<div id="cargo"></div><div id="hint">Yürümek için sürükle<br>veya WASD / yön tuşları</div>
<section id="energyDock" aria-label="Enerjin"><div class="label"><span>ENERJİN</span><b id="energyValue">%100</b></div><div class="track" role="progressbar" aria-label="Enerji" aria-valuemin="0" aria-valuemax="100" id="energyTrack"><div id="energyFill"></div></div><button id="breakButton">☕ Kahve köşesine git</button></section>
<section id="refreshments" hidden aria-label="Kahve ve atıştırmalık"><small>KISA BİR MOLA · ÜCRETSİZ</small><button id="drink">☕ Kahve iç · +30 enerji</button><button id="eat">🥪 Atıştır · +45 enerji</button></section>
<nav aria-label="Yönetim"><button id="projects">Projeler</button><button id="team">Şirket</button><button id="menu" aria-label="Duraklat ve menüyü aç">Ⅱ</button></nav>
<div id="toast" role="status"></div><div id="overlay" hidden><section class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Oyun menüsü"></section></div>
<script>
(()=>{'use strict';
const VERSION='1.1',KEY='plaza-yazilim-v1',W=760,H=1040;
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d'),overlay=$('#overlay'),panel=$('#panel');
const stages=[
 {name:'Brif',verb:'Müşteriyi dinle',x:175,y:260,color:'#e0b577',time:5,role:'Analist',cost:350},
 {name:'Yazılım',verb:'Kodu geliştir',x:585,y:260,color:'#9fbfe7',time:10,role:'Geliştirici',cost:550},
 {name:'Test',verb:'Hataları ayıkla',x:585,y:540,color:'#c5ade2',time:7,role:'Test uzmanı',cost:650},
 {name:'Yayın',verb:'Sunucuya yükle',x:175,y:540,color:'#a2cfb3',time:5,role:'DevOps',cost:800},
 {name:'Teslim',verb:'Projeyi teslim et',x:175,y:820,color:'#e4c778',time:3,role:'Müşteri temsilcisi',cost:950}
];
const templates=[{name:'Mahalle Kahvecisi',kind:'Web sitesi',pay:180,complexity:1},{name:'Mavi Rota',kind:'Rezervasyon sitesi',pay:260,complexity:1.2},{name:'Fırınım Cepte',kind:'Sipariş uygulaması',pay:420,complexity:1.5},{name:'Kuzey Lojistik',kind:'Operasyon paneli',pay:650,complexity:1.8},{name:'Nova Finans',kind:'Kurumsal platform',pay:1000,complexity:2.2},{name:'Atlas Teknoloji',kind:'Bulut altyapısı',pay:1500,complexity:2.7}];
const fresh=()=>({version:1,money:100,earned:0,done:0,seconds:0,next:1,offerCycle:0,staff:[0,0,0,0,0],tech:0,speed:0,bag:0,office:0,courier:0,coffee:0,coffeeLeft:0,coffeeCooldown:0,jobs:[],player:{x:380,y:840},bot:{x:380,y:760,job:null},intro:false,milestones:[]});
const finite=(n,d=0)=>Number.isFinite(n)?n:d,clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function restore(d){if(!d||d.version!==1)return fresh();const g=fresh();for(const k of ['money','earned','done','seconds','next','offerCycle','coffeeLeft','coffeeCooldown'])g[k]=Math.max(0,finite(d[k],g[k]));for(const [k,max]of Object.entries({tech:5,speed:3,bag:2,office:2,courier:1,coffee:1}))g[k]=clamp(Math.floor(finite(d[k])),0,max);g.staff=g.staff.map((_,i)=>clamp(Math.floor(finite(d.staff?.[i])),0,3));g.player={x:clamp(finite(d.player?.x,380),35,W-35),y:clamp(finite(d.player?.y,840),150,H-40)};g.bot={x:clamp(finite(d.bot?.x,380),35,W-35),y:clamp(finite(d.bot?.y,760),150,H-40),job:null};g.jobs=(Array.isArray(d.jobs)?d.jobs:[]).filter(j=>Number.isInteger(j.id)&&Number.isInteger(j.stage)&&j.stage>=0&&j.stage<5&&Number.isInteger(j.type)&&j.type>=0&&j.type<templates.length).slice(0,7).map(j=>({...j,work:Math.max(0,finite(j.work)),ready:!!j.ready,location:j.location==='player'?'player':j.location==='bot'?'bot':clamp(Math.floor(finite(j.location)),0,4)}));g.next=Math.max(g.next,1,...g.jobs.map(j=>j.id+1));for(const j of g.jobs)if(j.location==='bot'){if(g.bot.job===null&&g.courier)g.bot.job=j.id;else{j.location=j.stage;j.ready=false;}}g.intro=!!d.intro;g.milestones=Array.isArray(d.milestones)?d.milestones.filter(n=>[3,10,25,50].includes(n)):[];return g;}
function energyState(g,d=g){
 const old=d.wellbeing||{};
 g.wellbeing={player:clamp(finite(old.player,100),0,100),bot:clamp(finite(old.bot,100),0,100),coffeeCD:Math.max(0,finite(old.coffeeCD)),snackCD:Math.max(0,finite(old.snackCD)),meal:null,
  people:stages.map((s,i)=>{const a=old.people?.[i]||{};return {energy:clamp(finite(a.energy,100),0,100),x:clamp(finite(a.x,s.x+55),35,W-35),y:clamp(finite(a.y,s.y+8),150,H-40),mode:['work','out','eat','back'].includes(a.mode)?a.mode:'work',timer:clamp(finite(a.timer),0,10),kind:a.kind==='snack'?'snack':'coffee'};}),
  assistant:{mode:['work','out','eat','back'].includes(old.assistant?.mode)?old.assistant.mode:'work',timer:clamp(finite(old.assistant?.timer),0,10)}};
 if(old.meal&&['coffee','snack'].includes(old.meal.kind))g.wellbeing.meal={kind:old.meal.kind,left:clamp(finite(old.meal.left),0,6)};
 return g;
}
function restoreWithEnergy(d){return energyState(restore(d),d||{});}
let G;try{G=restoreWithEnergy(JSON.parse(localStorage.getItem(KEY)));}catch{G=energyState(fresh());}
let last=performance.now(),saveT=0,hudT=0,toastT=0,viewW=0,viewH=0,scale=1,cam={x:0,y:0},joy=null,keys={},auto=null,modalOpen=false,anim=0,frameCount=0,saveWarned=false;
const money=n=>'₺'+Math.floor(n).toLocaleString('tr-TR'),capacity=()=>3+G.office*2,bagCap=()=>2+G.bag,held=()=>G.jobs.filter(j=>j.location==='player'),near=(p,s)=>Math.hypot(p.x-s.x,p.y-s.y)<48;
function save(){try{localStorage.setItem(KEY,JSON.stringify(G));}catch{if(!saveWarned){saveWarned=true;toast('Kayıt saklanamadı. Tarayıcı depolama alanını kontrol et.');}}}
function toast(t){$('#toast').textContent=t;$('#toast').style.opacity=1;toastT=3.5;}
function open(html){modalOpen=true;joy=null;keys={};panel.innerHTML=html;overlay.hidden=false;panel.querySelector('button')?.focus();}
function close(){overlay.hidden=true;modalOpen=false;last=performance.now();save();}
const heading=t=>`<button class="close" data-action="close" aria-label="Kapat">×</button><div class="eyebrow">PLAZA YAZILIM</div><h2>${t}</h2>`;
function unlockTier(){return Math.min(5,Math.floor(G.done/3)+G.office);}
function offers(){const max=unlockTier()+1;return Array.from({length:Math.min(3,max)},(_,i)=>(G.offerCycle+i)%max);}
function accept(type){if(G.jobs.length>=capacity()||!offers().includes(type))return false;G.jobs.push({id:G.next++,type,stage:0,location:0,work:0,ready:false});G.offerCycle++;save();toast('Yeni proje toplantı masasında.');return true;}
function projects(){open(heading('Yeni bir fikir alalım.')+`<p>Her proje gerçek bir iş. Stok yok, sınırsız görev yığını yok. Aynı anda ${capacity()} proje alabilirsin.</p><div class="stats"><div><b>${G.jobs.length}/${capacity()}</b>Aktif proje</div><div><b>${G.done}</b>Teslim edildi</div></div>`+offers().map(i=>{const t=templates[i];return `<div class="row"><div><strong>${t.name}</strong><small>${t.kind} · ${money(t.pay)}<br>${Math.round(30*t.complexity)} sn temel çalışma + taşıma</small></div><button class="primary" data-action="accept" data-id="${i}" ${G.jobs.length>=capacity()?'disabled':''}>Projeyi al</button></div>`;}).join('')+(G.jobs.length?'<h3>Devam eden işler</h3>'+G.jobs.map(j=>`<div class="row"><div><strong>#${j.id} · ${templates[j.type].name}</strong><small>${j.location==='player'?'Çantanda → ':j.location==='bot'?'Asistanda → ':j.ready?'Taşınacak → ':''}${stages[j.stage].name} · ${money(templates[j.type].pay)}</small></div><button data-action="track" data-id="${j.id}">Takip et</button></div>`).join(''):''));}
const upgrades={tech:{title:'Güçlü bilgisayarlar',desc:'Tüm aşamalarda çalışma hızı +%25.',cost:()=>250*2**G.tech,max:5},speed:{title:'Rahat sneaker',desc:'Yürüme hızı +%15.',cost:()=>180*2**G.speed,max:3},bag:{title:'Proje çantası',desc:'Bir ek proje dosyası taşı.',cost:()=>260*2**G.bag,max:2},office:{title:'Stüdyoyu büyüt',desc:'İki ek proje kapasitesi, daha büyük müşteriler ve yeni ofis dekoru.',cost:()=>1200*3**G.office,max:2},courier:{title:'Operasyon asistanı',desc:'Dosyaları masalar arasında taşır. Senden biraz hızlı, bir proje kapasiteli.',cost:()=>700,max:1},coffee:{title:'Barista köşesi',desc:'Kahve köşesinde 45 saniyelik çalışma desteği. Yenileme: 60 oyun saniyesi.',cost:()=>300,max:1}};
function company(){open(heading('Küçük ekip. Büyük işler.')+`<p>Çalışanlar kendi masalarında çalışır. Dosyaları sen veya operasyon asistanın bir sonraki aşamaya götürür. Maaş kesintisi yok; işe alım tek seferlik.</p>`+stages.map((s,i)=>`<div class="row"><div><strong>${s.role} ${G.staff[i]?'· Sv. '+G.staff[i]:''}</strong><small>${s.name} aşamasını otomatik yapar.${G.staff[i]?' Terfi çalışma hızını artırır.':''}</small></div><button data-action="staff" data-id="${i}" ${G.staff[i]>=3||G.money<s.cost*2**G.staff[i]?'disabled':''}>${G.staff[i]>=3?'Tam seviye':money(s.cost*2**G.staff[i])}</button></div>`).join('')+'<h3>Ofis geliştirmeleri</h3>'+Object.entries(upgrades).map(([k,u])=>`<div class="row"><div><strong>${u.title} ${G[k]?'· '+G[k]:''}</strong><small>${u.desc}</small></div><button data-action="upgrade" data-id="${k}" ${G[k]>=u.max||G.money<u.cost()?'disabled':''}>${G[k]>=u.max?'Tamamlandı':money(u.cost())}</button></div>`).join(''));}
function purchase(kind,id){if(kind==='staff'){const s=stages[id];if(!s||G.staff[id]>=3)return false;const cost=s.cost*2**G.staff[id];if(G.money<cost)return false;G.money-=cost;G.staff[id]++;}else{const u=upgrades[id];if(!u||G[id]>=u.max||G.money<u.cost())return false;G.money-=u.cost();G[id]++;}save();return true;}
function menu(){open(heading('Bir kahve molası.')+`<p>Oyun duraklatıldı. Sekmeyi gizlediğinde veya oyunu kapattığında bütün işler durur. Geri dönünce kaldığın yerden devam edersin.</p><div class="stats"><div><b>${G.done}</b>Teslim</div><div><b>${money(G.earned)}</b>Toplam ciro</div><div><b>${Math.floor(G.seconds/60)} dk</b>Oynama</div></div><div class="legend"><span>1 · Brif</span><span>2 · Yazılım</span><span>3 · Test</span><span>4 · Yayın</span><span>5 · Teslim</span></div><p>Masaların önündeki renkli dairede dur: çalışma, dosyayı alma ve bırakma otomatik. Üstteki “Git” düğmesi sıradaki işe yürütür. Projeler menüsünden başka bir işi takip edebilirsin.</p><button class="primary" data-action="close">Devam et</button> <button data-action="export">Kaydı yedekle</button><p><a href="./index.html">Köy Fırını'na dön ↗</a> · v${VERSION}</p><button class="danger" data-action="reset">Yeni şirket kur</button>`);}
panel.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close')close();if(a==='accept'){if(accept(+id)){close();navigate(stages[0]);}}if(a==='track'){const j=G.jobs.find(j=>j.id===+id);if(j){close();navigate(stages[typeof j.location==='number'?j.location:j.stage]);}}if(a==='staff'||a==='upgrade'){purchase(a,a==='staff'?+id:id);company();}if(a==='reset')open(heading('Yeni şirket?')+'<p>Yalnızca Plaza Yazılım kaydı sıfırlanır. Köy Fırını kaydına dokunulmaz. Bu işlemi geri alamazsın.</p><button data-action="close">Vazgeç</button> <button class="danger" data-action="confirm-reset">Şirketi sıfırla</button>');if(a==='confirm-reset'){G=fresh();G.intro=true;auto=null;close();toast('Yeni şirketin hazır!');}if(a==='export'){const blob=new Blob([JSON.stringify(G,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='plaza-yazilim-kayit.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}});
$('#projects').onclick=projects;$('#team').onclick=company;$('#menu').onclick=menu;
const obstacles=[...stages.map(s=>({x:s.x-82,y:s.y-105,w:164,h:69})),{x:490,y:715,w:150,h:62}];
function move(p,dx,dy){let x=clamp(p.x+dx,35,W-35),y=clamp(p.y+dy,150,H-40);for(const r of obstacles){if(x>r.x-13&&x<r.x+r.w+13&&p.y>r.y-12&&p.y<r.y+r.h+12)x=p.x;if(x>r.x-13&&x<r.x+r.w+13&&y>r.y-12&&y<r.y+r.h+12)y=p.y;}p.x=x;p.y=y;}
function route(p,t){if(Math.abs(p.y-t.y)<12)return [{x:t.x,y:t.y}];return [{x:380,y:p.y},{x:380,y:t.y},{x:t.x,y:t.y}];}
function navigate(t){auto=route(G.player,t);}
function walk(p,path,dt,speed){if(!path?.length)return false;const t=path[0],dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy);if(d<3){path.shift();return !!path.length;}const n=Math.min(d,speed*dt);move(p,dx/d*n,dy/d*n);return true;}
function target(){const cargo=held();if(cargo.length)return {s:stages[cargo[0].stage],text:'Dosyayı '+stages[cargo[0].stage].name.toLocaleLowerCase('tr')+' masasına götür',sub:templates[cargo[0].type].name};const ready=G.jobs.find(j=>j.ready&&typeof j.location==='number');if(ready)return {s:stages[ready.location],text:'Hazır dosyayı al → '+stages[ready.stage].name,sub:templates[ready.type].name};const work=G.jobs.find(j=>typeof j.location==='number'&&!G.staff[j.stage])||G.jobs.find(j=>typeof j.location==='number');if(work)return {s:stages[work.stage],text:stages[work.stage].verb,sub:templates[work.type].name};if(G.jobs.length)return {s:stages[0],text:'Asistan dosyayı taşıyor',sub:'Yeni projelere göz atabilirsin.'};return {s:null,text:'İlk adım: bir müşteri projesi al',sub:'Projeler menüsü · Ofisin yeni bir fikri bekliyor.'};}
$('#go').onclick=()=>{const t=target();if(t.s)navigate(t.s);else projects();};
let botPath=[],botTarget=null;

function frame(now){requestAnimationFrame(frame);const elapsed=(now-last)/1000;if(elapsed<1/30)return;last=now;if(document.hidden||modalOpen){render();return;}const dt=clamp(elapsed,0,.06);update(dt);if((hudT+=dt)>.15){hudT=0;hud();energyHUD();}if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').style.opacity=0;}frameCount++;render();}
canvas.addEventListener('pointerdown',e=>{if(modalOpen)return;canvas.setPointerCapture(e.pointerId);joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};auto=null;});canvas.addEventListener('pointermove',e=>{if(!joy||joy.id!==e.pointerId)return;const dx=e.clientX-joy.ox,dy=e.clientY-joy.oy,d=Math.hypot(dx,dy)||1;joy.x=joy.ox+dx/d*Math.min(d,55);joy.y=joy.oy+dy/d*Math.min(d,55);});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>joy=null);
addEventListener('keydown',e=>{if(e.code==='Escape'){modalOpen?close():menu();return;}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();keys[e.code]=true;}});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};joy=null;save();});addEventListener('resize',resize);addEventListener('pagehide',save);addEventListener('pageshow',()=>last=performance.now());document.addEventListener('visibilitychange',()=>{last=performance.now();keys={};joy=null;if(document.hidden)save();});
